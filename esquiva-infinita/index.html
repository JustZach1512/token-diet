<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Esquiva Infinita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Escenario 3:4 centrado; en táctil el mando queda bajo el lienzo */
  --void:#0b0716;
  --ink:#efe9ff;
  --spark:#ffe46b;
  --neon:#6ef3ff;
  --hazard:#ff4f8b;
  --panel:#1a1033;
  --display:"Bungee", Impact, "Arial Black", sans-serif;
  --body:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body.touch.portrait{justify-content:flex-start;padding-top:6px}
#c{display:block;border-radius:6px;box-shadow:0 0 0 1px #2a1d4a,0 20px 60px rgba(0,0,0,.65)}
#pad{display:none;position:fixed;left:0;right:0;bottom:0;padding:14px 16px;justify-content:space-between;pointer-events:none}
body.touch #pad{display:flex}
#pad button{pointer-events:auto;font:700 15px/1 var(--body);letter-spacing:.08em;color:var(--ink);
  background:var(--panel);border:2px solid #3b2a66;border-radius:50%;width:92px;height:92px;touch-action:none}
#pad button.ready{border-color:var(--neon);color:var(--neon);box-shadow:0 0 18px rgba(110,243,255,.35)}
#pad button:active{background:#2a1a50}
button:focus-visible{outline:2px solid var(--spark);outline-offset:3px}
body.hidecursor #c{cursor:none}
#admin{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 32px));z-index:10;
  background:rgba(16,9,34,.97);border:2px solid var(--neon);border-radius:14px;padding:16px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 0 40px rgba(110,243,255,.25);touch-action:auto;user-select:auto}
#admin[hidden]{display:none}
.ad-head{display:flex;justify-content:space-between;align-items:center;font:400 18px/1 var(--display);letter-spacing:.04em;color:var(--neon)}
.ad-head button{background:none;border:0;color:var(--ink);font:700 18px/1 var(--body);cursor:pointer;padding:4px 8px;border-radius:6px}
.ad-row{display:flex;flex-direction:column;gap:8px}
.ad-tog{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:2px solid #3b2a66;
  background:var(--panel);color:var(--ink);font:700 15px/1.2 var(--body);text-align:left;cursor:pointer}
.ad-tog .st{margin-left:auto;font-size:13px;color:#8a7fb0}
.ad-tog[aria-pressed="true"]{border-color:var(--spark);box-shadow:0 0 14px rgba(255,228,107,.25)}
.ad-tog[aria-pressed="true"] .st{color:var(--spark)}
#admin kbd{font:700 12px/1 var(--body);background:#2a1a50;border:1px solid #4b3a80;border-radius:5px;padding:3px 7px;color:var(--spark)}
.ad-speed{display:flex;align-items:center;gap:10px;font:500 13px var(--body);color:#8a7fb0}
.ad-speed input[type=range]{flex:1;accent-color:var(--spark)}
.ad-speed input[type=number]{width:78px;padding:6px 8px;border-radius:8px;border:1px solid #4b3a80;background:var(--void);color:var(--ink);font:700 14px var(--body)}
.ad-note{margin:0;font:500 13px/1.4 var(--body);color:#8a7fb0}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Esquiva Infinita: esquiva los ataques dentro de la caja"></canvas>
<div id="pad">
  <button id="bPulse" type="button" aria-label="Pulso">PULSO</button>
  <button id="bShield" type="button" aria-label="Invencibilidad">INVENC.</button>
  <button id="bJump" type="button" aria-label="Saltar" style="visibility:hidden">SALTO</button>
</div>
<div id="admin" role="dialog" aria-label="Panel admin" hidden>
  <div class="ad-head"><span>PANEL ADMIN</span><button id="adClose" type="button" aria-label="Cerrar panel">✕</button></div>
  <div class="ad-row">
    <button type="button" class="ad-tog" id="ad1" aria-pressed="false"><kbd>1</kbd>Velocidad extra<span class="st">OFF</span></button>
    <label class="ad-speed" for="adSpeedN"><input type="range" id="adSpeedR" min="50" max="1500" step="10" aria-label="Velocidad"><input type="number" id="adSpeedN" min="50" max="1500" step="10">px/s</label>
    <p class="ad-note">Velocidad normal: 210 px/s.</p>
  </div>
  <div class="ad-row">
    <button type="button" class="ad-tog" id="ad2" aria-pressed="false"><kbd>2</kbd>Inmunidad infinita<span class="st">OFF</span></button>
  </div>
  <div class="ad-row">
    <button type="button" class="ad-tog" id="ad3" aria-pressed="false"><kbd>3</kbd>Orbes defensores<span class="st">OFF</span></button>
    <p class="ad-note">Disparan solos a la bala más cercana y la destruyen. No afectan a muros, láseres ni casillas.</p>
  </div>
  <p class="ad-note">La partida está en pausa. <kbd>H</kbd> o <kbd>Esc</kbd> para volver.</p>
</div>
<script>
'use strict';
// ================= Utilidades =================
const W = 600, H = 800, TAU = Math.PI * 2;
const C = { ink:'#efe9ff', dim:'#8a7fb0', spark:'#ffe46b', neon:'#6ef3ff', hazard:'#ff4f8b', violet:'#b48cff',
  rose:'#ff8ad8', frost:'#8fe3ff', ember:'#ff9a3c', heal:'#5dffa1', white:'#ffffff', grav:'#c58bff', deep:'#1a0b2e' };
const FD = '"Bungee", Impact, "Arial Black", sans-serif';
const FB = '"Chakra Petch", "Segoe UI", system-ui, sans-serif';
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rgba(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const sp = d => Math.min(G.hard ? 2.6 : 2.1, 1 + (d - 1) * 0.25);   // velocidad de los ataques
const rt = d => Math.min(G.hard ? 3 : 2.4, 1 + (d - 1) * 0.3);    // frecuencia de los ataques
const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

const Store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let best = Store.get('esquiva.best', { score: 0, wave: 0, time: 0 });
let bestHC = Store.get('esquiva.best.hc', { score: 0, wave: 0, time: 0 });

// ================= Sonido (WebAudio, todo sintetizado) =================
const AudioSys = {
  ac: null, master: null, sfx: null, mus: null, musLP: null, bassBus: null, delay: null, verb: null, noiseBuf: null,
  muted: Store.get('esquiva.muted', false), last: {}, drive: 0,
  init(){
    if (this.ac) { if (this.ac.state === 'suspended' && !G.paused) this.ac.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ac = this.ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
      comp.connect(ac.destination);
      this.master = ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.9; this.master.connect(comp);
      this.sfx = ac.createGain(); this.sfx.gain.value = 0.5; this.sfx.connect(this.master);
      // música: bus → filtro que se cierra entre oleadas y se abre de golpe al empezar el ataque
      this.musLP = ac.createBiquadFilter(); this.musLP.type = 'lowpass'; this.musLP.frequency.value = 20000; this.musLP.Q.value = 0.8;
      this.musLP.connect(this.master);
      this.mus = ac.createGain(); this.mus.gain.value = 0.22; this.mus.connect(this.musLP);
      // bajo saturado (más sucio en hardcore)
      this.bassBus = ac.createWaveShaper(); this.bassBus.oversample = '2x'; this.bassBus.connect(this.mus); this.setDrive(1.2);
      // eco filtrado + reverb sintética
      this.delay = ac.createDelay(1); this.delay.delayTime.value = 0.35;
      const fb = ac.createGain(), dlp = ac.createBiquadFilter(), wet = ac.createGain();
      fb.gain.value = 0.33; dlp.type = 'lowpass'; dlp.frequency.value = 1800; wet.gain.value = 0.4;
      this.delay.connect(dlp); dlp.connect(fb); fb.connect(this.delay); dlp.connect(wet); wet.connect(this.mus);
      const len = Math.floor(ac.sampleRate * 2.2), ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
      this.verb = ac.createConvolver(); this.verb.buffer = ir;
      const vg = ac.createGain(); vg.gain.value = 0.3; this.verb.connect(vg); vg.connect(this.mus);
      const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      if (ac.state === 'suspended') ac.resume().catch(() => {});
    } catch (e) { this.ac = null; }
  },
  setMuted(m){ this.muted = m; Store.set('esquiva.muted', m); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ac.currentTime, 0.02); },
  setDrive(k){
    if (!this.bassBus || this.drive === k) return;
    this.drive = k;
    const n = 1024, c = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / (n - 1) - 1; c[i] = Math.tanh(k * x) / k; }
    this.bassBus.curve = c;
  },
  musDuck(on, time = 1){
    if (!this.ac) return;
    const p = this.musLP.frequency, t = this.ac.currentTime;
    p.cancelScheduledValues(t); p.setValueAtTime(Math.max(100, p.value), t);
    p.exponentialRampToValueAtTime(on ? 650 : 20000, t + (on ? time : 0.06));
  },
  tone(f, dur, o = {}){
    const ac = this.ac; if (!ac) return;
    const t = o.at != null ? o.at : ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + (o.att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.dest || this.sfx); osc.start(t); osc.stop(t + dur + 0.02);
  },
  noise(dur, o = {}){
    const ac = this.ac; if (!ac || !this.noiseBuf) return;
    const t = o.at != null ? o.at : ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noiseBuf; src.loop = true; f.type = o.ftype || 'lowpass'; f.frequency.setValueAtTime(o.freq || 3000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(o.vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx); if (o.verb) g.connect(this.verb);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  },
  // Voz de sintetizador: osciladores desafinados (con paneo) → filtro con barrido → envolvente → bus
  synth(f, dur, o){
    const ac = this.ac, t = o.at, lp = ac.createBiquadFilter(), g = ac.createGain(), att = o.att || 0.005;
    lp.type = 'lowpass'; lp.Q.value = o.q || 1;
    lp.frequency.setValueAtTime(o.cut * (o.sweep || 1), t);
    if (o.sweep) lp.frequency.exponentialRampToValueAtTime(o.cut, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol, t + att);
    if (o.hold) g.gain.setValueAtTime(o.vol, t + Math.max(att, dur - o.hold));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    (o.det || [0]).forEach((det, i) => {
      const osc = ac.createOscillator(); osc.type = o.type || 'sawtooth'; osc.frequency.value = f; osc.detune.value = det;
      if (o.pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = o.pan[i % o.pan.length]; osc.connect(p); p.connect(lp); }
      else osc.connect(lp);
      osc.start(t); osc.stop(t + dur + 0.03);
    });
    lp.connect(g); g.connect(o.bus === 'bass' ? this.bassBus : this.mus);
    if (o.echo) g.connect(this.delay);
    if (o.verb) g.connect(this.verb);
  },
  // Melodía: dos sierras + octava cuadrada, vibrato que entra poco a poco, eco y reverb
  lead(f, dur, t){
    const ac = this.ac, lp = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain(), og = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.015);
    g.gain.setValueAtTime(0.045, t + Math.max(0.02, dur - 0.06)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lfo.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(dur > 0.3 ? 16 : 4, t + Math.min(0.3, dur)); lfo.connect(lg);
    og.gain.value = 0.25; og.connect(lp);
    [[-7, 'sawtooth', 1, lp], [7, 'sawtooth', 1, lp], [0, 'square', 2, og]].forEach(([det, type, mul, out]) => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = f * mul; o.detune.value = det;
      lg.connect(o.detune); o.connect(out); o.start(t); o.stop(t + dur + 0.03);
    });
    lfo.start(t); lfo.stop(t + dur + 0.03);
    lp.connect(g); g.connect(this.mus); g.connect(this.delay); g.connect(this.verb);
  },
  // Cuerdas en trémolo: capa de tensión (poca vida y hardcore)
  trem(f, dur, t, vol){
    const ac = this.ac, lp = ac.createBiquadFilter(), g = ac.createGain(), am = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 3000;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.4);
    g.gain.setValueAtTime(vol, t + Math.max(0.45, dur - 0.2)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    am.gain.value = 0.5; lfo.frequency.value = 11; lg.gain.value = 0.5; lfo.connect(lg); lg.connect(am.gain);
    for (const det of [-5, 5]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det; o.connect(lp); o.start(t); o.stop(t + dur + 0.05); }
    lfo.start(t); lfo.stop(t + dur + 0.05);
    lp.connect(am); am.connect(g); g.connect(this.mus); g.connect(this.verb);
  },
  kick(t, v = 1){ this.tone(150, 0.17, { type: 'sine', vol: 0.75 * v, to: 40, at: t, dest: this.mus }); this.noise(0.02, { vol: 0.1 * v, freq: 3500, at: t, dest: this.mus }); },
  hat(t, v, open){ this.noise(open ? 0.18 : 0.035, { vol: v, freq: 7500, ftype: 'highpass', at: t, dest: this.mus }); },
  snare(t, v = 1){ this.noise(0.15, { vol: 0.24 * v, freq: 1900, ftype: 'bandpass', at: t, dest: this.mus, verb: v > 0.9 }); this.tone(190, 0.09, { type: 'triangle', vol: 0.12 * v, to: 140, at: t, dest: this.mus }); },
  crash(t, v = 1){ this.noise(1.4, { vol: 0.08 * v, freq: 5500, ftype: 'highpass', at: t, dest: this.mus, verb: true }); },
  crashNow(){ if (this.ac && !this.muted) this.crash(this.ac.currentTime, 1.2); },
  tom(t, f0){ this.tone(f0, 0.2, { type: 'sine', vol: 0.35, to: f0 * 0.55, at: t, dest: this.mus }); },
  riser(d){   // subida de ruido antes de cada oleada
    if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime, src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noiseBuf; src.loop = true; bp.type = 'bandpass'; bp.Q.value = 3;
    bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(6000, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.13, t + d); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.06);
    src.connect(bp); bp.connect(g); g.connect(this.sfx); src.start(t); src.stop(t + d + 0.1);
    this.tone(110, d, { type: 'sawtooth', vol: 0.03, to: 440, att: d * 0.85 });
  },
  play(name){
    if (!this.ac || this.muted) return;
    const now = performance.now(), gap = { graze: 45, pop: 40, blip: 30, laser: 70, shot: 50, warn: 90, jump: 60, orb: 80 }[name] || 0;
    if (gap && now - (this.last[name] || 0) < gap) return;
    this.last[name] = now;
    const n = s => 440 * Math.pow(2, s / 12);
    switch (name) {
      case 'hit': this.noise(0.25, { vol: 0.35, freq: 1800, to: 200 }); this.tone(220, 0.25, { vol: 0.16, to: 70 }); break;
      case 'graze': this.tone(1500 + Math.random() * 300, 0.05, { type: 'sine', vol: 0.07 }); break;
      case 'warn': this.tone(320, 0.45, { type: 'sine', vol: 0.06, to: 900, att: 0.05 }); break;
      case 'laser': this.noise(0.3, { vol: 0.16, freq: 5000, to: 600 }); this.tone(110, 0.3, { type: 'sawtooth', vol: 0.07, to: 55 }); break;
      case 'boom': this.noise(0.35, { vol: 0.25, freq: 1200, to: 120 }); this.tone(90, 0.3, { type: 'sine', vol: 0.25, to: 40 }); break;
      case 'pop': this.tone(620, 0.08, { type: 'triangle', vol: 0.1, to: 200 }); break;
      case 'shot': this.tone(900, 0.06, { vol: 0.035, to: 500 }); break;
      case 'impact': this.tone(68, 0.7, { type: 'sine', vol: 0.5, to: 30 }); this.noise(0.6, { vol: 0.2, freq: 1000, to: 80 }); this.tone(n(-24), 0.5, { type: 'sawtooth', vol: 0.05, to: n(-36) }); break;
      case 'heal': [3, 7, 10, 15, 19].forEach((s, i) => this.tone(n(s), 0.14, { type: 'triangle', vol: 0.12, delay: i * 0.05 })); break;
      case 'perfect': [7, 14, 19, 26].forEach((s, i) => this.tone(n(s), 0.12, { type: 'triangle', vol: 0.1, delay: i * 0.07 })); break;
      case 'ready': this.tone(880, 0.08, { type: 'sine', vol: 0.1 }); this.tone(1320, 0.12, { type: 'sine', vol: 0.1, delay: 0.08 }); break;
      case 'pulse': this.noise(0.5, { vol: 0.3, freq: 300, to: 4000, ftype: 'bandpass' }); this.tone(80, 0.4, { type: 'sine', vol: 0.3, to: 40 }); break;
      case 'shield': [12, 16, 19, 24, 28].forEach((s, i) => this.tone(n(s), 0.16, { type: 'triangle', vol: 0.1, delay: i * 0.035 })); this.noise(0.4, { vol: 0.12, freq: 800, to: 7000, ftype: 'bandpass' }); break;
      case 'shieldEnd': this.tone(n(19), 0.18, { type: 'triangle', vol: 0.08, to: n(7) }); break;
      case 'shieldReady': this.tone(n(19), 0.1, { type: 'sine', vol: 0.09 }); this.tone(n(24), 0.16, { type: 'sine', vol: 0.09, delay: 0.1 }); break;
      case 'tick': this.tone(1760, 0.05, { type: 'sine', vol: 0.07 }); break;
      case 'orb': this.tone(1200 + Math.random() * 200, 0.04, { type: 'triangle', vol: 0.03, to: 1800 }); break;
      case 'jump': this.tone(300, 0.1, { vol: 0.05, to: 620 }); break;
      case 'death':
        this.noise(0.9, { vol: 0.35, freq: 2500, to: 100 });
        [0, -3, -7, -12].forEach((s, i) => this.tone(n(s - 5), 0.22, { vol: 0.1, delay: i * 0.14 }));
        [-24, -23, -17].forEach(m => this.synth(n(m), 2.6, { at: this.ac.currentTime + 0.1, vol: 0.05, cut: 900, att: 0.05, det: [-12, 12], verb: true }));
        break;

  LEAD: [[0, 7, 4], [4, 5, 2], [6, 3, 2], [8, 2, 2], [10, 3, 4], [14, 0, 2],

  start(level){

  },
  stop(){ this.on = false; },
  tick(){
    const ac = AudioSys.ac; if (!this.on || !ac || ac.state !== 'running') return;

      else A.synth(f(seq[(sec === 3 ? b : s) % 6]), 0.08, { at: t, vol: 0.02, cut: 3200, type: 'square', pan: [((b % 4) - 1.5) * 0.3] });
    }
    if (L <= 1) { if (b === 0 || b === 3 || b === 8 || b === 11) A.kick(t, L === 0 ? 0.5 : b % 4 ? 0.6 : 1); }   // latido
    else if (sec === 2 && !hard) { if (b === 0 || b === 10) A.kick(t); if (b === 8) A.snare(t, 1.1); }          // medio tiempo
    else {
      if (b % 4 === 0 || (sec === 1 && b === 10) || (hard && (b === 7 || b === 14))) A.kick(t);
      if (b === 4 || b === 12) A.snare(t);
    }
    if (dz && (b === 6 || b === 14)) A.kick(t, 0.5);
    if (L >= 1) A.hat(t, b % 4 === 2 ? 0.07 : hard ? 0.045 : 0.028, L >= 2 && b === 14 && sec !== 2);

  }

// ================= Entrada: teclado, ratón y táctil =================
const KEYMAP = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down',
  Shift: 'focus', z: 'confirm', Enter: 'confirm', ' ': 'confirm', x: 'pulse', c: 'pulse', p: 'shield', Escape: 'pause',
  m: 'mute', h: 'admin', q: 'quit', '1': 'ad1', '2': 'ad2', '3': 'ad3' };
const keys = {}, hit = {};
const keyName = e => KEYMAP[e.key && e.key.length === 1 ? e.key.toLowerCase() : e.key];
addEventListener('keydown', e => {
  const k = keyName(e);
  if (e.target && e.target.tagName === 'INPUT' && k !== 'admin' && k !== 'pause') {   // escribiendo la velocidad en el panel
    if (e.key === 'Enter') e.target.blur();
    return;
  }
  if (!k) return;
  e.preventDefault(); AudioSys.init();
  if (!keys[k]) hit[k] = true;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = keyName(e); if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const view = { s: 1, k: 1 };
const mouse = { x: 300, y: 470, cx: -1, cy: -1, seen: false };
const touch = { id: null, sx: 0, sy: 0, px: 0, py: 0, tx: null, ty: null, extra: null };
let isTouch = false;
function setTouch(){ if (isTouch) return; isTouch = true; document.body.classList.add('touch'); resize(); }
function toLogical(cx, cy){ const r = cv.getBoundingClientRect(); return { x: (cx - r.left) / view.s, y: (cy - r.top) / view.s }; }
document.addEventListener('pointerdown', e => {
  AudioSys.init();
  if (e.target.closest && e.target.closest('button, input, #admin')) return;
  if (e.pointerType !== 'mouse') setTouch();
  const p = toLogical(e.clientX, e.clientY);
  if (e.pointerType === 'mouse') { mouse.x = p.x; mouse.y = p.y; mouse.seen = true; }
  e.preventDefault();
  if (uiTap(p)) return;
  if (G.state === 'title') { const i = menuHit(p); if (i >= 0) { G.sel = i; hit.confirm = true; } return; }
  if (G.state === 'over') { if (inRect(p, BTN.retry)) hit.confirm = true; else if (inRect(p, BTN.menu)) hit.menu = true; return; }
  if (G.state !== 'play') return;
  if (G.paused) { if (!ADM.open) { if (inRect(p, BTN.resume)) hit.confirm = true; else if (inRect(p, BTN.quit)) hit.quit = true; } return; }
  if (e.pointerType === 'mouse') {   // modo ratón: clic = saltar, clic derecho = pulso
    if (G.ctrl === 'mouse') { if (e.button === 0) { keys.jump = true; hit.jump = true; } else if (e.button === 2) hit.pulse = true; }
    return;
  }
  if (touch.id === null) Object.assign(touch, { id: e.pointerId, sx: e.clientX, sy: e.clientY, px: P.x, py: P.y, tx: P.x, ty: P.y });
  else if (touch.extra === null) { touch.extra = e.pointerId; keys.jump = true; hit.jump = true; }   // 2º dedo = saltar
}, { passive: false });
document.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') {
    if (e.clientX === mouse.cx && e.clientY === mouse.cy) return;   // ignora movimientos sintéticos sin desplazamiento
    mouse.cx = e.clientX; mouse.cy = e.clientY;
    const p = toLogical(e.clientX, e.clientY);
    mouse.x = p.x; mouse.y = p.y; mouse.seen = true;
    if (G.state === 'title') { const i = menuHit(p); if (i >= 0) G.sel = i; }
    return;
  }
  if (e.pointerId !== touch.id) return;
  const k = 1.25 / view.s, m = P.vis - 1;
  const tx = touch.px + (e.clientX - touch.sx) * k, ty = touch.py + (e.clientY - touch.sy) * k;
  const cx = clamp(tx, arena.l + m, arena.r - m), cy = clamp(ty, arena.t + m, arena.b - m);
  touch.px += cx - tx; touch.py += cy - ty;   // re-anclar: sin zona muerta al volver desde un borde
  touch.tx = cx; touch.ty = cy;
}, { passive: true });
function endPointer(e){
  if (e.pointerType === 'mouse' && e.button === 0) keys.jump = false;
  if (e.pointerId === touch.id) { touch.id = null; touch.tx = touch.ty = null; }
  if (e.pointerId === touch.extra) { touch.extra = null; keys.jump = false; }
}
document.addEventListener('pointerup', endPointer);
document.addEventListener('pointercancel', endPointer);
document.addEventListener('contextmenu', e => { if (G.state === 'play') e.preventDefault(); });
function holdButton(id, key){
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); AudioSys.init(); setTouch(); keys[key] = true; hit[key] = true; try { b.setPointerCapture(e.pointerId); } catch (_) {} });
  const up = () => { keys[key] = false; };

holdButton('bPulse', 'pulse');

function resize(){
  const portrait = innerHeight >= innerWidth;
  document.body.classList.toggle('portrait', portrait);
  const padH = isTouch && portrait ? 124 : 0;
  const s = Math.max(0.2, Math.min((innerWidth - 12) / W, (innerHeight - 12 - padH) / H));
  const dpr = Math.min(2.5, window.devicePixelRatio || 1), cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  view.s = s; view.k = cv.width / W;

// ================= La caja =================
const arena = {
  x: 300, y: 470, w: 260, h: 260, tx: 300, ty: 470, tw: 260, th: 260, flash: 0,
  get l(){ return this.x - this.w / 2; }, get r(){ return this.x + this.w / 2; },
  get t(){ return this.y - this.h / 2; }, get b(){ return this.y + this.h / 2; },
  set(w, h, x = 300, y = 470){ this.tw = w; this.th = h; this.tx = x; this.ty = y; },
  snap(){ this.x = this.tx; this.y = this.ty; this.w = this.tw; this.h = this.th; },
  update(dt){
    const k = 1 - Math.exp(-dt * 9);
    this.x = lerp(this.x, this.tx, k); this.y = lerp(this.y, this.ty, k);
    this.w = lerp(this.w, this.tw, k); this.h = lerp(this.h, this.th, k);
    this.flash = Math.max(0, this.flash - dt);
  }
};
const A = arena;

// ================= La chispa (jugador) =================
const P = { x: 300, y: 470, r: 4.5, vis: 9, hp: 20, maxHp: 20, trail: 20, inv: 0, mode: 'free', vy: 0, ground: false,
  stillT: 1, charge: 0, spin: 0, alive: true, extX: 0, extY: 0, shieldT: 0, shieldCd: 0 };
const SPEED = 210, FOCUS = 0.45, GRAV = 1500, JUMP = 560, GRAZE = 15;

function updatePlayer(dt){
  if (!P.alive) return;
  P.inv = Math.max(0, P.inv - dt);
  const ox = P.x, oy = P.y;
  const fast = G.admin && ADM.speedOn, slow = keys.focus ? FOCUS : 1;
  const spd = (fast ? ADM.speed : SPEED) * slow, tmax = (fast ? ADM.speed : 450) * slow * dt;
  let mx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), my = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  let tx = touch.tx, ty = touch.ty;
  if (tx == null && G.ctrl === 'mouse') {   // modo ratón: la chispa persigue al cursor; el teclado solo salta
    mx = my = 0;
    if (mouse.seen) { const m = P.vis - 1; tx = clamp(mouse.x, A.l + m, A.r - m); ty = clamp(mouse.y, A.t + m, A.b - m); }
  }
  if (P.mode === 'gravity') {
    if (tx != null) P.x += clamp(tx - P.x, -tmax, tmax);
    else P.x += mx * spd * dt;
    const jumpKey = keys.up || keys.confirm || keys.jump;
    if (jumpKey && P.ground) { P.vy = -JUMP; P.ground = false; AudioSys.play('jump'); }
    P.vy = Math.min(P.vy + (P.vy < 0 && !jumpKey ? GRAV * 2.6 : GRAV) * dt, 760);
    P.y += P.vy * dt;
  } else if (tx != null) {
    const dx = tx - P.x, dy = ty - P.y, d = Math.hypot(dx, dy);
    if (d > 0.01) { const m = Math.min(d, tmax); P.x += dx / d * m; P.y += dy / d * m; }
  } else {
    if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
    P.x += mx * spd * dt; P.y += my * spd * dt;
  }
  P.x += P.extX * dt; P.y += P.extY * dt;
  const m = P.vis - 1;
  P.x = clamp(P.x, A.l + m, A.r - m);
  if (P.y >= A.b - m) { P.y = A.b - m; if (P.mode === 'gravity') { if (P.vy > 0) P.vy = 0; P.ground = true; } }
  else P.ground = false;
  if (P.y <= A.t + m) { P.y = A.t + m; if (P.vy < 0) P.vy = 0; }
  const moved = Math.hypot(P.x - ox, P.y - oy);
  if (moved > 0.12) P.stillT = 0; else P.stillT += dt;
  P.spin += dt * (moved > 0.12 ? 7 : 2);
  P.trail = Math.max(P.hp, P.trail - dt * 6);
}

const comboMult = () => 1 + Math.min(3, Math.floor(G.combo / 15) * 0.5);
const scoreMul = () => G.hard ? 2 : 1;   // hardcore puntúa doble

function hurt(base){
  if (P.inv > 0 || P.shieldT > 0 || G.god || (G.admin && ADM.immune) || !P.alive) return;
  const dmg = G.hard ? 3 : Math.round(base + Math.max(0, D.diff - 1) * 0.6);   // hardcore: siempre 3
  P.hp = Math.max(0, P.hp - dmg); P.inv = G.hard ? 0.8 : 1.1; G.combo = 0; D.noHit = false;
  G.shake = RM ? 2 : 9; G.flash = RM ? 0.06 : 0.28; A.flash = 0.4;
  burst(P.x, P.y, C.hazard, 14, 160, 0.5, 3);
  popup(P.x, P.y - 18, '-' + dmg, C.hazard);
  AudioSys.play('hit'); Boss.mood('laugh', 1.2);
  if (P.hp <= 0) die();
}
function die(){
  P.alive = false; G.state = 'dying'; G.deadT = 0; touch.id = null; touch.tx = touch.ty = null;
  burst(P.x, P.y, C.spark, 44, 260, 1.1, 3.5);
  AudioSys.play('death'); Music.stop(); Boss.mood('laugh', 3);
  G.overLine = pick(OVER_LINES);
  const rec = { score: Math.floor(G.score), wave: D.wave, time: Math.floor(G.time) };
  G.newBest = !G.admin && G.score > (G.hard ? bestHC : best).score;
  if (G.newBest) { if (G.hard) { bestHC = rec; Store.set('esquiva.best.hc', rec); } else { best = rec; Store.set('esquiva.best', rec); } }
  AudioSys.musDuck(false);
}
function graze(b){
  const small = b.shape === 'circle' && b.r < 10;
  b.grazeCd = small ? 99 : 0.22;
  G.combo++; G.grazes++;
  G.score += (small ? 5 : 3) * comboMult() * scoreMul();
  if (P.charge < 100) {
    P.charge = Math.min(100, P.charge + (small ? 4 : 2.5));
    if (P.charge >= 100) { AudioSys.play('ready'); popup(P.x, P.y - 22, '¡PULSO LISTO!', C.neon); }
  }
  const a = Math.random() * TAU;
  particles.push({ x: P.x + Math.cos(a) * 9, y: P.y + Math.sin(a) * 9, vx: Math.cos(a) * 70, vy: Math.sin(a) * 70, life: 0.3, max: 0.3, color: C.white, size: 2 });
  AudioSys.play('graze'); Boss.mood('surprised', 0.35);
}

// ================= Balas =================
const bullets = [];
function spawn(o){
  const b = Object.assign({ shape: 'circle', x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, r: 6, w: 10, h: 10, a: 0, hl: 50, th: 10,
    color: C.ink, kind: null, dmg: 3, t: 0, warn: 0, life: 30, grazeCd: 0, dead: false, safe: false,
    update: null, draw: null, over: null, keep: false }, o);
  if (b.destructible === undefined) b.destructible = b.shape === 'circle' && b.r <= 9;
  if (G.hard && b.warn > 0) b.warn *= 0.75;   // hardcore: avisos más cortos
  bullets.push(b); return b;
}
function move(b, dt){ b.vx += b.ax * dt; b.vy += b.ay * dt; b.x += b.vx * dt; b.y += b.vy * dt; }
function updateBullets(dt){
  for (const b of bullets) {
    if (b.dead) continue;
    b.t += dt;
    if (b.update) b.update(b, dt);
    else if (b.t >= b.warn) move(b, dt);
    if (b.t > b.life) b.dead = true;
    if (!b.keep && (b.x < -150 || b.x > W + 150 || b.y < -150 || b.y > H + 150)) b.dead = true;
  }
  let j = 0;
  for (let i = 0; i < bullets.length; i++) if (!bullets[i].dead) bullets[j++] = bullets[i];
  bullets.length = j;
}
function hitTest(b, px, py, rad){
  if (b.shape === 'circle') { const dx = px - b.x, dy = py - b.y, rr = b.r + rad; return dx * dx + dy * dy < rr * rr; }
  if (b.shape === 'rect') {
    const c = Math.cos(-b.a), s = Math.sin(-b.a), dx = px - b.x, dy = py - b.y;
    const lx = dx * c - dy * s, ly = dx * s + dy * c;
    const qx = clamp(lx, -b.w / 2, b.w / 2), qy = clamp(ly, -b.h / 2, b.h / 2);
    return (lx - qx) ** 2 + (ly - qy) ** 2 < rad * rad;
  }
  const ex = Math.cos(b.a), ey = Math.sin(b.a), dx = px - b.x, dy = py - b.y;
  const t = clamp(dx * ex + dy * ey, -b.hl, b.hl), qx = b.x + ex * t, qy = b.y + ey * t, rr = b.th / 2 + rad;
  return (px - qx) ** 2 + (py - qy) ** 2 < rr * rr;
}
function collide(dt){
  const moving = P.stillT < 0.05;
  let worst = null;
  for (const b of bullets) {
    if (b.dead || b.t < b.warn || b.safe) continue;
    if (b.grazeCd > 0) b.grazeCd -= dt;
    if ((b.kind === 'ice' && !moving) || (b.kind === 'fire' && moving)) continue;   // regla de fuego y hielo
    if (hitTest(b, P.x, P.y, P.r)) { if (!worst || b.dmg > worst.dmg) worst = b; continue; }
    if (b.grazeCd <= 0 && P.inv <= 0 && P.shieldT <= 0 && hitTest(b, P.x, P.y, P.r + GRAZE)) graze(b);
  }
  if (worst) hurt(worst.dmg);
}

// ================= Dibujo de balas =================
const SPR = new Map();
function sprite(color, r){
  const key = color + '|' + Math.round(r * 2);
  let s = SPR.get(key); if (s) return s;
  const R = Math.ceil(r * 2.1 + 5), S = R * 2, k = 3, c = document.createElement('canvas');
  c.width = c.height = S * k;
  const g = c.getContext('2d'); g.scale(k, k);
  const grd = g.createRadialGradient(R, R, r * 0.7, R, R, R);
  grd.addColorStop(0, rgba(color, 0.55)); grd.addColorStop(1, rgba(color, 0));
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  g.beginPath(); g.arc(R, R, r, 0, TAU); g.fillStyle = color; g.fill();
  g.beginPath(); g.arc(R, R, r * 0.55, 0, TAU); g.fillStyle = '#fff'; g.fill();
  s = { c, R }; SPR.set(key, s); return s;
}
function orb(color, r, x, y){ const s = sprite(color, r); ctx.drawImage(s.c, x - s.R, y - s.R, s.R * 2, s.R * 2); }
function line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function drawRect(x, y, w, h, a, col){
  ctx.save(); ctx.translate(x, y); if (a) ctx.rotate(a);
  ctx.fillStyle = rgba(col, 0.25); ctx.fillRect(-w / 2 - 3, -h / 2 - 3, w + 6, h + 6);
  ctx.fillStyle = col; ctx.fillRect(-w / 2, -h / 2, w, h);
  const i = Math.min(3, w * 0.3, h * 0.3);
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(-w / 2 + i, -h / 2 + i, w - 2 * i, h - 2 * i);
  ctx.restore();
}
function drawBeam(x, y, a, hl, th, col, al = 1){
  const dx = Math.cos(a) * hl, dy = Math.sin(a) * hl;
  ctx.save(); ctx.globalAlpha = al; ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(col, 0.3); ctx.lineWidth = th * 1.7; line(x - dx, y - dy, x + dx, y + dy);
  ctx.strokeStyle = col; ctx.lineWidth = th; line(x - dx, y - dy, x + dx, y + dy);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = th * 0.4; line(x - dx, y - dy, x + dx, y + dy);
  ctx.restore();
}
function drawTele(b){
  ctx.save(); ctx.globalAlpha = 0.35 + 0.45 * (Math.sin(b.t * 28) * 0.5 + 0.5);
  ctx.strokeStyle = b.color; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
  if (b.shape === 'circle') { ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, TAU); ctx.stroke(); }
  else if (b.shape === 'rect') { ctx.translate(b.x, b.y); if (b.a) ctx.rotate(b.a); ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h); }
  else { const dx = Math.cos(b.a) * b.hl, dy = Math.sin(b.a) * b.hl; ctx.setLineDash([]); ctx.lineWidth = 1.5; line(b.x - dx, b.y - dy, b.x + dx, b.y + dy); }
  ctx.restore();
}
function drawBullet(b){
  const warn = b.t < b.warn;
  if (b.draw) return b.draw(b, warn);
  if (warn) return drawTele(b);
  if (b.shape === 'circle') orb(b.color, b.r, b.x, b.y);
  else if (b.shape === 'rect') drawRect(b.x, b.y, b.w, b.h, b.a, b.color);
  else drawBeam(b.x, b.y, b.a, b.hl, b.th, b.color);
}

const particles = [], popups = [];
function burst(x, y, color, n, spd, life, size){
  for (let i = 0; i < n && particles.length < 700; i++) {
    const a = Math.random() * TAU, v = spd * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.4), max: life, color, size });
  }
}
function popup(x, y, text, color, big){ popups.push({ x, y, text, color, t: 0, life: big ? 1.6 : 0.9, big }); }
function updateFx(dt){
  const f = Math.exp(-dt * 3);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= f; p.vy *= f; p.life -= dt; }
  for (const p of popups) p.t += dt;
  let j = 0; for (const p of particles) if (p.life > 0) particles[j++] = p; particles.length = j;
  j = 0; for (const p of popups) if (p.t < p.life) popups[j++] = p; popups.length = j;
}
function drawParticles(){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.restore();
}
function drawPopups(){
  for (const p of popups) {
    const k = p.t / p.life;
    ctx.globalAlpha = k < 0.75 ? 1 : 1 - (k - 0.75) / 0.25;
    if (p.big) txt(p.text, p.x, p.y - 30 * ease(Math.min(1, k * 2)), 20, p.color, 'center', FD, 400);
    else txt(p.text, p.x, p.y - 28 * k, 14, p.color);
  }
  ctx.globalAlpha = 1;
}

const pickups = [], pulses = [];
function spawnHeal(){

  while (Math.hypot(x - P.x, y - P.y) < 70 && ++n < 12);
  pickups.push({ x, y, t: 0, life: 5.5 });
}
function updatePickups(dt){
  for (const k of pickups) {
    k.t += dt;
    if (P.alive && Math.hypot(P.x - k.x, P.y - k.y) < 17) {
      k.t = k.life; const before = P.hp; P.hp = Math.min(P.maxHp, P.hp + 5);

  for (const k of pickups) {

    const y = k.y + Math.sin(k.t * 4) * 2;

}
function usePulse(){
  if (P.charge < 100 || !P.alive) return;
  P.charge = 0; pulses.push({ x: P.x, y: P.y, r: 0, t: 0 });
  P.inv = Math.max(P.inv, 0.7); G.shake = RM ? 2 : 6; Boss.flinch = 0.6;

}
function updatePulses(dt){
  for (const p of pulses) {
    p.t += dt; p.r = 140 * ease(Math.min(1, p.t / 0.45));
    for (const b of bullets) {
      if (b.dead || !b.destructible || b.t < b.warn) continue;

    }

}
function drawPulses(){
  for (const p of pulses) {
    const a = 1 - p.t / 0.6;
    ctx.fillStyle = rgba(C.neon, 0.08 * a); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();

}

}
function updateShield(dt){
  if (P.shieldT > 0) {

    if ((P.shieldT -= dt) <= 0) { P.shieldT = 0; P.shieldCd = SHIELD_CD; AudioSys.play('shieldEnd'); }
    else if (before <= 3 && Math.ceil(P.shieldT) < before) AudioSys.play('tick');   // aviso: quedan 3, 2, 1 s

// ================= Orbes defensores (panel admin) =================
const shots = [];
let shotCd = 0;
const orbable = b => !b.dead && !b.core && !b.safe && b.t >= b.warn && (b.shape === 'circle' || (b.shape === 'rect' && Math.max(b.w, b.h) <= 24));
function updateShots(dt){
  if (G.admin && ADM.orbs && P.alive && (shotCd -= dt) <= 0) {
    let tgt = null, bd = 330 * 330;
    for (const b of bullets) {
      if (!orbable(b) || b.x < A.l || b.x > A.r || b.y < A.t || b.y > A.b) continue;
      const d = (b.x - P.x) ** 2 + (b.y - P.y) ** 2;
      if (d < bd) { bd = d; tgt = b; }
    }
    if (tgt) {
      const a = angTo(P.x, P.y, tgt.x, tgt.y);
      shots.push({ x: P.x, y: P.y, vx: Math.cos(a) * 640, vy: Math.sin(a) * 640, t: 0, dead: false });
      shotCd = 0.1; AudioSys.play('orb');
    }
  }
  for (const s of shots) {
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t > 0.8 || s.x < A.l || s.x > A.r || s.y < A.t || s.y > A.b) { s.dead = true; continue; }
    for (const b of bullets) {
      if (!orbable(b) || !hitTest(b, s.x, s.y, 5)) continue;
      s.dead = true; b.hp = (b.hp || 1) - 1;
      if (b.hp <= 0) { b.dead = true; burst(b.x, b.y, b.color, 6, 110, 0.35, 2.2); G.score += 2; }
      else burst(s.x, s.y, C.spark, 3, 80, 0.2, 2);
      break;
    }
  }
  let j = 0; for (const s of shots) if (!s.dead) shots[j++] = s; shots.length = j;
}
function drawShots(){
  for (const s of shots) {
    ctx.strokeStyle = rgba(C.spark, 0.35); ctx.lineWidth = 3; line(s.x - s.vx * 0.02, s.y - s.vy * 0.02, s.x, s.y);
    orb(C.spark, 4, s.x, s.y);
  }
}

// Cada ataque: init(S, d) y update(S, dt, d). d = dificultad; S.m < 1 cuando se combina con otro.
const PATTERNS = [];
const def = p => PATTERNS.push(Object.assign({ mode: 'free', combo: true, minWave: 1, dur: 9, hint: '' }, p));

function ring(x, y, n, v, a0, color, r = 5){
  for (let i = 0; i < n; i++) { const a = a0 + i * TAU / n; spawn({ x, y, r, vx: Math.cos(a) * v, vy: Math.sin(a) * v, color }); }
}
function edgePoint(out){
  const side = randi(0, 3);
  if (side === 0) return { x: rand(A.l, A.r), y: A.t - out };
  if (side === 1) return { x: A.r + out, y: rand(A.t, A.b) };
  if (side === 2) return { x: rand(A.l, A.r), y: A.b + out };
  return { x: A.l - out, y: rand(A.t, A.b) };
}
function farPoint(minD, pad){
  let x, y, n = 0;
  do { x = rand(A.l + pad, A.r - pad); y = rand(A.t + pad, A.b - pad); } while (Math.hypot(x - P.x, y - P.y) < minD && ++n < 20);
  return { x, y };
}
function rayExit(x, y, dx, dy){
  let t = 1e9;
  if (dx > 1e-6) t = Math.min(t, (A.r - x) / dx); else if (dx < -1e-6) t = Math.min(t, (A.l - x) / dx);
  if (dy > 1e-6) t = Math.min(t, (A.b - y) / dy); else if (dy < -1e-6) t = Math.min(t, (A.t - y) / dy);
  return t;
}

function laser(x, y, a, warn, th, color = C.neon){
  return spawn({ shape: 'seg', x, y, a, hl: 800, th, warn, life: warn + 0.5, color, dmg: 4, destructible: false, keep: true,
    update(b){
      if (!b.fired && b.t >= b.warn) { b.fired = true; AudioSys.play('laser'); G.shake = Math.max(G.shake, RM ? 1 : 3); }
      b.safe = b.t > b.warn + 0.3;
    },
    draw(b, warn){
      if (warn) {
        const k = b.t / b.warn, dx = Math.cos(b.a) * b.hl, dy = Math.sin(b.a) * b.hl;
        ctx.save(); ctx.strokeStyle = rgba(b.color, 0.06 + 0.14 * k); ctx.lineWidth = b.th; line(b.x - dx, b.y - dy, b.x + dx, b.y + dy);
        ctx.strokeStyle = rgba(b.color, Math.floor(b.t * 20) % 2 ? 0.9 : 0.4); ctx.lineWidth = 1.5; line(b.x - dx, b.y - dy, b.x + dx, b.y + dy);
        ctx.restore();
      } else {
        const f = 1 - clamp((b.t - b.warn - 0.3) / 0.2, 0, 1), grow = Math.min(1, (b.t - b.warn) / 0.05);
        drawBeam(b.x, b.y, b.a, b.hl, b.th * grow * (0.5 + 0.5 * f), b.color, f);
      }
    },
    over(b){
      if (b.t > b.warn + 0.3) return;
      const ex = Math.cos(b.a), ey = Math.sin(b.a);
      for (const s of [1, -1]) {
        const d = rayExit(b.x, b.y, ex * s, ey * s) + 13, x = b.x + ex * s * d, y = b.y + ey * s * d;
        ctx.save(); ctx.translate(x, y); ctx.rotate(b.a + Math.PI / 4);
        ctx.fillStyle = b.t >= b.warn ? '#fff' : b.color; ctx.fillRect(-6, -6, 12, 12);
        ctx.strokeStyle = C.deep; ctx.lineWidth = 2; ctx.strokeRect(-3, -3, 6, 6); ctx.restore();
      }
    } });
}

// 7 · Torretas que apuntan
function turretPos(T){
  const o = 20;
  if (T.edge === 0) return [lerp(A.l, A.r, T.u), A.t - o];
  if (T.edge === 1) return [A.r + o, lerp(A.t, A.b, T.u)];
  if (T.edge === 2) return [lerp(A.l, A.r, T.u), A.b + o];
  return [A.l - o, lerp(A.t, A.b, T.u)];
}
def({ id: 'torretas', name: 'TORRETAS', minWave: 4, box: [320, 300], dur: 9,
  line: 'Te apuntan a ti. Muévete justo después del destello.',
  init(S, d){
    const n = Math.min(5, 2 + Math.floor((d - 1) / 1.1));

      [T.x, T.y] = turretPos(T);

function drawCell(b, warn){

    const k = b.t / b.warn;
    ctx.globalAlpha = 0.35 + 0.5 * (Math.floor(b.t * (8 + 14 * k)) % 2);
    ctx.strokeStyle = C.hazard; ctx.lineWidth = 2; ctx.strokeRect(-w / 2 + 2, -h / 2 + 2, w - 4, h - 4);
    ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip(); ctx.lineWidth = 1.5;
    for (let i = -w; i < w; i += 12) line(i, -h / 2, i + h, h / 2);
  } else {
    const f = 1 - clamp((b.t - b.warn - 0.25) / 0.15, 0, 1);
    ctx.globalAlpha = f; ctx.fillStyle = C.hazard; ctx.fillRect(-w / 2, -h / 2, w, h);

}

// 14 · Serpientes que persiguen
function makeSnake(d){
  const p = edgePoint(20), gap = 12, spd = 135 * Math.pow(sp(d), 0.8), turn = 1.9;
  const head = spawn({ x: p.x, y: p.y, r: 9, color: C.violet, dmg: 4, destructible: false, life: 14, hp: 2, ang: angTo(p.x, p.y, P.x, P.y), spd,
    update(b, dt){
      if (b.t < 3.6) b.ang += clamp(angDiff(angTo(b.x, b.y, P.x, P.y), b.ang), -turn * dt, turn * dt) + Math.sin(b.t * 6) * 1.6 * dt;
      else b.spd += 90 * dt;
      b.vx = Math.cos(b.ang) * b.spd; b.vy = Math.sin(b.ang) * b.spd; b.x += b.vx * dt; b.y += b.vy * dt;
    },
    draw(b){
      orb(C.violet, 9, b.x, b.y);
      const ex = Math.cos(b.ang), ey = Math.sin(b.ang);
      ctx.fillStyle = C.hazard;
      for (const s of [1, -1]) { ctx.beginPath(); ctx.arc(b.x + ex * 3 - ey * 4 * s, b.y + ey * 3 + ex * 4 * s, 2.2, 0, TAU); ctx.fill(); }
    } });
  let lead = head;
  for (let i = 1; i <= 12; i++) {
    lead = spawn({ x: p.x, y: p.y, r: 7 - i * 0.25, color: i % 2 ? '#9f7bff' : C.violet, dmg: 3, destructible: false, life: 14, lead,
      update(b, dt){
        const L = b.lead;
        if (L && !L.dead) {
          const dx = b.x - L.x, dy = b.y - L.y, dd = Math.hypot(dx, dy);
          if (dd > gap) { const nx = L.x + dx / dd * gap, ny = L.y + dy / dd * gap; b.vx = (nx - b.x) / dt; b.vy = (ny - b.y) / dt; b.x = nx; b.y = ny; }
        } else { b.lead = null; b.x += b.vx * dt; b.y += b.vy * dt; }
      } });
  }
}

function clearField(){ bullets.length = particles.length = popups.length = pickups.length = pulses.length = shots.length = 0; }
function startRun(admin = G.admin, ctrl = G.ctrl, hard = G.hard){
  G.admin = admin; G.ctrl = ctrl; G.hard = hard && !admin;
  const hp = G.hard ? 10 : 20; ADM.open = false; adEl.hidden = true;
  clearField();
  Object.assign(P, { x: 300, y: 470, hp, maxHp: hp, trail: hp, inv: 0, charge: 0, mode: 'free', vy: 0, ground: false, alive: true, stillT: 1, extX: 0, extY: 0, shieldT: 0, shieldCd: 0 });
  Object.assign(G, { state: 'play', paused: false, score: 0, time: 0, grazes: 0, combo: 0, deadT: 0, newBest: false });
  Object.assign(D, { wave: 0, phase: 'idle', t: 0, picks: [], runs: [], bag: [], seen: new Set(), last: null });
  arena.set(260, 260);
  touch.id = touch.extra = null; touch.tx = touch.ty = null;
  Boss.text = ''; Music.start(G.hard ? 4 : 1); AudioSys.play('select');

}
function chooseWave(){
  const elig = G.hard ? PATTERNS : PATTERNS.filter(p => p.minWave <= D.wave);
  const comboWave = G.hard ? D.wave >= 3 && D.wave % 2 === 1 : D.wave >= 10 && ((D.wave - 10) % 4 === 0 || (D.wave > 24 && D.wave % 3 === 0));
  if (comboWave) {
    const pool = elig.filter(p => p.combo && (G.hard || D.seen.has(p.id)));
    if (pool.length >= 2) { const a = pick(pool); let b; do b = pick(pool); while (b === a); return [a, b]; }
  }
  const fresh = elig.filter(p => !D.seen.has(p.id));
  if (!G.hard && fresh.length && (D.wave <= 3 || Math.random() < 0.85)) return [fresh[0]];
  if (!D.bag.length) D.bag = shuffle(elig.slice());
  let p = D.bag.pop();
  if (p === D.last && D.bag.length) { const q = D.bag.pop(); D.bag.unshift(p); p = q; }
  return [p];
}
function nextWave(){

function beginAttack(){

const HEAL_EVERY = 3, HEAL_AMOUNT = 7;

function updateDirector(dt){

const Boss = {
  x: 300, y: 168, t: 0, m: 'idle', mt: 0, cast: 0, flinch: 0, blink: 3, text: '', shown: 0, hold: 0,
  mood(m, t){ if (m === 'surprised' && this.m !== 'idle') return; this.m = m; this.mt = t; },
  say(s, hold = 2.6){ this.text = s; this.shown = 0; this.hold = hold; },
  update(dt){
    this.t += dt;
    if ((this.mt -= dt) <= 0) this.m = 'idle';
    this.cast = Math.max(0, this.cast - dt * 1.4); this.flinch = Math.max(0, this.flinch - dt);
    if ((this.blink -= dt) < -0.12) this.blink = rand(2, 5);
    if (!this.text) return;
    if (this.shown < this.text.length) {
      const before = Math.floor(this.shown);
      this.shown = Math.min(this.text.length, this.shown + dt * 40);
      const now = Math.floor(this.shown);
      if (now !== before && now % 2 === 0 && this.text[now - 1] !== ' ') AudioSys.play('blip');
    } else if ((this.hold -= dt) <= 0) this.text = '';
  },
  draw(){
    const x = this.x + (this.flinch > 0 ? Math.sin(this.t * 70) * 5 * this.flinch : 0), y = this.y + Math.sin(this.t * 1.3) * 6;
    const g = ctx.createRadialGradient(x, y, 10, x, y, 140);
    const hc = hardLook() ? '255,79,139' : '180,140,255';
    g.addColorStop(0, `rgba(${hc},0.24)`); g.addColorStop(1, `rgba(${hc},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - 140, y - 140, 280, 280);
    const rot = this.t * (0.4 + this.cast * 2.2);
    const shard = (i, front) => {
      const a = rot + i * TAU / 8, s = Math.sin(a);
      if ((s > 0) !== front) return;
      const rr = 80 + Math.sin(this.t * 2 + i) * 4;
      ctx.save(); ctx.translate(x + Math.cos(a) * rr, y + s * rr * 0.42); ctx.rotate(a * 2 + this.t);
      ctx.globalAlpha = front ? 1 : 0.45; ctx.fillStyle = i % 2 ? C.violet : C.rose;
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(6, 6); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill(); ctx.restore();
    };
    for (let i = 0; i < 8; i++) shard(i, false);
    for (const s of [-1, 1]) {
      const hx = x + s * 108, hy = y + 20 + Math.sin(this.t * 1.7 + s) * 6 - this.cast * 28;
      if (this.cast > 0.05) { ctx.globalAlpha = this.cast; orb(C.violet, 10, hx, hy); ctx.globalAlpha = 1; }
      ctx.save(); ctx.translate(hx, hy); ctx.rotate(Math.PI / 4 + this.t * 0.5 * s);
      ctx.fillStyle = '#2a1650'; ctx.strokeStyle = C.violet; ctx.lineWidth = 2;
      ctx.fillRect(-9, -9, 18, 18); ctx.strokeRect(-9, -9, 18, 18); ctx.restore();
    }
    ctx.save(); ctx.translate(x, y);
    const bg = ctx.createLinearGradient(0, -66, 0, 66);
    bg.addColorStop(0, '#3a2170'); bg.addColorStop(1, '#120a26');
    ctx.beginPath(); ctx.moveTo(0, -66); ctx.lineTo(48, 0); ctx.lineTo(0, 66); ctx.lineTo(-48, 0); ctx.closePath();
    ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = C.violet; ctx.stroke();
    ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5;
    line(0, -66, 0, -30); line(0, 30, 0, 66); line(-48, 0, -32, 0); line(48, 0, 32, 0);
    ctx.globalAlpha = 1;
    const ex = clamp((P.x - x) / 40, -7, 7), ey = clamp((P.y - y) / 60, -4, 6);
    if (this.m === 'laugh') {
      ctx.strokeStyle = '#f4ecff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-20, 6); ctx.quadraticCurveTo(0, -16, 20, 6); ctx.stroke();
    } else {
      const open = this.blink < 0 ? 0.1 : this.m === 'surprised' ? 1.35 : this.flinch > 0 ? 0.35 : 1;
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.quadraticCurveTo(0, -22 * open, 26, 0); ctx.quadraticCurveTo(0, 22 * open, -26, 0);
      ctx.fillStyle = '#f4ecff'; ctx.fill();
      if (open > 0.3) {
        ctx.save(); ctx.clip();
        ctx.fillStyle = C.hazard; ctx.beginPath(); ctx.arc(ex, ey, this.m === 'surprised' ? 5 : 8, 0, TAU); ctx.fill();
        ctx.fillStyle = C.deep; ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
    for (let i = 0; i < 8; i++) shard(i, true);
  }
};

  const cw = size * 0.62, w = cw * s.length, x0 = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;

  for (const w of s.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);

}

  if (G.state === 'play') { drawIconBtn(UI.pause, G.paused && !ADM.open ? 'play' : 'pause'); if (G.admin) drawIconBtn(UI.admin, 'H'); }
}
function hudBar(x, y, f, col, edge){
  ctx.fillStyle = '#1c1236'; ctx.fillRect(x, y, 190, 14);
  ctx.fillStyle = col; ctx.fillRect(x, y, 190 * clamp(f, 0, 1), 14);
  ctx.strokeStyle = edge || '#3b2a66'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.5, y + 0.5, 189, 13);
}
function drawBottom(){
  const y1 = 678, y2 = 706, y3 = 734, X = 96, V = 296, full = P.charge >= 100;
  txt('PV', 24, y1 + 13, 14, C.dim, 'left');
  ctx.fillStyle = '#1c1236'; ctx.fillRect(X, y1, 190, 14);
  ctx.fillStyle = C.hazard; ctx.fillRect(X, y1, 190 * P.trail / P.maxHp, 14);
  ctx.fillStyle = P.hp / P.maxHp > 0.3 ? C.spark : C.hazard; ctx.fillRect(X, y1, 190 * P.hp / P.maxHp, 14);
  ctx.strokeStyle = '#3b2a66'; ctx.lineWidth = 1.5; ctx.strokeRect(X + 0.5, y1 + 0.5, 189, 13);
  numText(P.hp + '/' + P.maxHp, V, y1 + 13, 16, C.ink);
  txt('CARGA', 24, y2 + 13, 14, C.dim, 'left');
  hudBar(X, y2, P.charge / 100, full ? rgba(C.neon, 0.75 + 0.25 * Math.sin(G.clock * 10)) : rgba(C.neon, 0.7), full ? C.neon : null);
  if (full) txt(isTouch ? '¡LISTO! toca PULSO' : '¡LISTO! pulsa X', V, y2 + 13, 13, C.neon, 'left');
  else numText(Math.floor(P.charge) + '%', V, y2 + 13, 16, C.ink);
  txt('INVENC.', 24, y3 + 13, 14, C.dim, 'left');
  if (P.shieldT > 0) { hudBar(X, y3, P.shieldT / SHIELD_DUR, C.spark, C.spark); txt('ACTIVA ' + P.shieldT.toFixed(1) + ' s', V, y3 + 13, 13, C.spark, 'left'); }
  else if (P.shieldCd > 0) { hudBar(X, y3, 1 - P.shieldCd / SHIELD_CD, rgba(C.spark, 0.35)); numText(Math.ceil(P.shieldCd) + ' s', V, y3 + 13, 16, C.ink); }
  else { hudBar(X, y3, 1, rgba(C.spark, 0.8 + 0.2 * Math.sin(G.clock * 6)), C.spark); txt(isTouch ? '¡LISTA! toca INVENC.' : '¡LISTA! pulsa P', V, y3 + 13, 13, C.spark, 'left'); }
  txt('TIEMPO', 436, y1 + 13, 14, C.dim, 'left'); numText(fmtTime(G.time), 576, y1 + 13, 16, C.ink, 'right');
  txt('ROCES', 436, y2 + 13, 14, C.dim, 'left'); numText(G.combo + ' x' + comboMult().toFixed(1), 576, y2 + 13, 16, G.combo >= 15 ? C.spark : C.ink, 'right');
  txt((G.admin ? 'ADMIN · ' : G.hard ? 'HARDCORE · ' : 'MODO ') + (G.ctrl === 'mouse' ? 'RATÓN' : 'TECLADO'), 576, y3 + 13, 13, G.admin ? C.violet : G.hard ? C.hazard : C.dim, 'right');
  const hint = isTouch ? 'Arrastra para mover · roza balas para cargar el PULSO'
    : (G.ctrl === 'mouse' ? 'Ratón mover · clic saltar · ' : 'WASD mover · Shift precisión · ')
      + (G.admin ? 'X pulso · P invencibilidad · H panel' : 'X pulso · P invencibilidad · Esc pausa');
  txt(hint, 300, 784, 13, '#6f6596', 'center', FB, 500);
}
function drawBanner(){
  if (G.state !== 'play' || !D.picks.length) return;
  const a = D.phase === 'trans' ? Math.min(1, D.t / 0.25) : D.phase === 'attack' ? clamp(1 - (D.t - 1.4) / 0.5, 0, 1) : 0;
  const p0 = D.picks[0], hint = D.combo ? '' : typeof p0.hint === 'function' ? p0.hint() : p0.hint;
  if (a > 0) {
    ctx.globalAlpha = a;
    const name = D.picks.map(p => p.name).join(' + '), size = D.combo ? 17 : 22, y = A.t - 20;
    txt(name, 302, y + 2, size, rgba(C.neon, 0.6), 'center', FD);
    txt(name, 300, y, size, C.ink, 'center', FD);
    if (D.isNew) { ctx.font = size + 'px ' + FD; pill('NUEVO', 300 + ctx.measureText(name).width / 2 + 34, y - 7, C.hazard); }
    if (D.wave % HEAL_EVERY === 0) txt('+' + HEAL_AMOUNT + ' PV AL ACABAR ESTA OLEADA', 300, y - 26, 13, C.heal);
    ctx.globalAlpha = 1;
  }
  const ha = D.phase !== 'attack' ? a : p0.keepHint ? 0.85 : clamp(1 - (D.t - 2.5) / 0.5, 0, 1);
  if (hint && ha > 0) { ctx.globalAlpha = ha; txt(hint, 300, A.b + 27, 15, C.spark); ctx.globalAlpha = 1; }
}

// ================= Pantallas =================
function drawInfinity(cx, cy, s, t){
  const pt = a => { const d = 1 + Math.sin(a) ** 2; return [cx + s * Math.cos(a) / d, cy + s * Math.sin(a) * Math.cos(a) / d]; };
  ctx.save(); ctx.lineWidth = 3.5; ctx.strokeStyle = C.spark; ctx.shadowColor = C.spark; ctx.shadowBlur = 12; ctx.beginPath();
  for (let i = 0; i <= 80; i++) { const [x, y] = pt(i / 80 * TAU); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
  ctx.stroke(); ctx.restore();
  const [x, y] = pt(t * 1.8); orb(C.white, 4, x, y);
}
function drawTitle(){
  const y = 292, hl = G.menu === 'hard';
  txt('ESQUIVA', 297, y + 3, 60, rgba(hl ? C.ember : C.neon, 0.55), 'center', FD);
  txt('ESQUIVA', 303, y - 3, 60, rgba(C.hazard, 0.5), 'center', FD);
  txt('ESQUIVA', 300, y, 60, C.ink, 'center', FD);
  drawInfinity(300, 328, 44, G.clock);
  txt({ main: 'Elige cómo quieres jugar.', hard: 'Hardcore: ¿con qué te mueves?', admin: 'Modo admin: ¿con qué te mueves?' }[G.menu], 300, 374, 15, C.dim, 'center', FB, 500);
  MENUS[G.menu].forEach((it, i) => {
    const cy = menuY(i), sel = i === G.sel, red = it.label.startsWith('HARDCORE'), col = red ? C.hazard : C.neon;
    if (sel) { ctx.fillStyle = rgba(col, 0.12); roundRect(150, cy - 19, 300, 38, 10); ctx.fill(); ctx.strokeStyle = rgba(col, 0.85); ctx.lineWidth = 2; ctx.stroke(); }
    txt(it.label, 312, cy + 7, 18, sel ? (red ? '#ffd0de' : C.ink) : rgba(red ? C.hazard : C.ink, 0.6), 'center', FD);
  });
  const rows = G.menu === 'admin'
    ? [['H', 'abrir o cerrar el panel en partida'], ['1', 'velocidad extra (tú eliges cuánta)'], ['2', 'inmunidad infinita'], ['3', 'orbes que destruyen balas'], ['Ojo', 'en modo admin no se guarda el récord']]
    : hl
      ? [['Vida', '10 PV · cada golpe quita 3'], ['Ataques', 'más rápidos, más densos y avisan menos'], ['Combos', 'dos ataques a la vez cada dos oleadas'], ['Curas', 'solo +7 PV automáticos cada 3 oleadas'], ['Premio', 'puntos x2 y récord propio']]
      : isTouch
        ? [['Arrastra', 'mover la chispa'], ['Roza balas', 'llena la CARGA del PULSO'], ['INVENC.', 'invencible 15 s · recarga 30 s'], ['Cada 3 oleadas', 'te curas 7 PV'], ['SALTO', 'saltar en modo gravedad']]
        : [['WASD / ratón', 'mover (según el modo)'], ['Roza balas', 'suma puntos y llena la CARGA'], ['X', 'pulso que borra balas pequeñas'], ['P', 'invencibilidad 15 s · recarga 30 s'], ['Cada 3 oleadas', 'te curas 7 PV'], ['Espacio / clic', 'saltar en modo gravedad']];
  rows.forEach(([k, v], i) => { const yy = 614 + i * 23; txt(k, 288, yy, 15, hl ? C.hazard : C.spark, 'right'); txt(v, 300, yy, 15, C.ink, 'left', FB, 500); });
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(G.clock * 4);
  txt(isTouch ? 'TOCA UN MODO PARA EMPEZAR' : 'ELIGE CON ↑ ↓ Y PULSA ENTER', 300, 756, 18, C.spark, 'center', FD);
  ctx.globalAlpha = 1;
  const recs = [best.score > 0 && 'Récord: ' + best.score + ' pts · oleada ' + best.wave, bestHC.score > 0 && 'Hardcore: ' + bestHC.score + ' pts · oleada ' + bestHC.wave].filter(Boolean);
  if (recs.length) txt(recs.join('   ·   '), 300, 784, 13, C.dim);
}
function btn(r, label, hot){
  ctx.fillStyle = hot ? rgba(C.spark, 0.14) : '#1a1033'; roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = hot ? C.spark : '#3b2a66'; ctx.lineWidth = 2; ctx.stroke();
  txt(label, r.x + r.w / 2, r.y + r.h / 2 + 6, 15, hot ? C.spark : C.ink, 'center', FD);
}
function drawOver(){
  ctx.fillStyle = 'rgba(8,4,18,0.82)'; ctx.fillRect(0, 0, W, H);
  txt('DERRIBADO', 300, 250, 50, C.hazard, 'center', FD);
  if (G.hard) pill('HARDCORE', 300, 280, C.hazard);
  [['OLEADA', String(D.wave)], ['TIEMPO', fmtTime(G.time)], ['ROCES', String(G.grazes)], ['PUNTOS', String(Math.floor(G.score))]]
    .forEach(([k, v], i) => { const y = 318 + i * 38; txt(k, 200, y, 15, C.dim, 'left'); numText(v, 400, y, 22, C.ink, 'right'); });
  if (G.admin) txt('Modo admin: el récord no se guarda', 300, 492, 15, C.violet);
  else if (G.newBest) txt(G.hard ? '¡NUEVO RÉCORD HARDCORE!' : '¡NUEVO RÉCORD!', 300, 492, G.hard ? 20 : 24, C.spark, 'center', FD);
  else { const rb = G.hard ? bestHC : best; txt((G.hard ? 'Récord hardcore: ' : 'Récord: ') + rb.score + ' pts · oleada ' + rb.wave, 300, 492, 15, C.dim); }
  txt('EL ARQUITECTO', 300, 540, 11, C.violet);
  ctx.font = '500 17px ' + FB;
  wrap('«' + G.overLine + '»', 440).forEach((l, i) => txt(l, 300, 566 + i * 22, 17, C.ink, 'center', FB, 500));
  if (G.overT > 0.8) {
    btn(BTN.retry, 'REINTENTAR', true); btn(BTN.menu, 'MENÚ', false);
    if (!isTouch) txt('Enter: reintentar · Esc: menú', 300, 684, 13, C.dim);
  }
}
function drawPause(){
  ctx.fillStyle = 'rgba(8,4,18,0.7)'; ctx.fillRect(0, 0, W, H);
  if (ADM.open) return;
  txt('PAUSA', 300, 400, 48, C.ink, 'center', FD);
  txt(isTouch ? 'Toca SEGUIR para continuar' : 'Esc: seguir · Q: menú · M: sonido', 300, 440, 15, C.dim);
  btn(BTN.resume, 'SEGUIR', true); btn(BTN.quit, 'MENÚ', false);
}
function render(){
  ctx.setTransform(view.k, 0, 0, view.k, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBG();
  const sh = G.shake > 0.2 && !G.paused ? G.shake : 0;
  ctx.save(); if (sh) ctx.translate(rand(-sh, sh), rand(-sh, sh));
  Boss.draw(); drawBubble(); drawArena();
  ctx.save(); clipArena(); for (const b of bullets) drawBullet(b); drawPickups(); drawPulses(); drawShots(); ctx.restore();
  drawBorder();
  for (const b of bullets) if (b.over) b.over(b);
  for (const r of D.runs) if (r.p.over) r.p.over(r.S);
  drawParticles(); drawPlayer(); drawPopups();
  ctx.restore();
  drawBanner(); drawTop();
  if (G.state !== 'title') drawBottom();
  if (G.flash > 0) { ctx.fillStyle = rgba(C.hazard, G.flash * 0.5); ctx.fillRect(0, 0, W, H); }
  if (G.state === 'title') drawTitle(); else if (G.state === 'over') drawOver();
  if (G.paused) drawPause();
}

// ================= Panel admin =================
const ADM = { open: false, speedOn: false, speed: clamp(Math.round(+Store.get('esquiva.adspeed', 450)) || 450, 50, 1500), immune: false, orbs: false };
const adEl = document.getElementById('admin'), adR = document.getElementById('adSpeedR'), adN = document.getElementById('adSpeedN');
function adminSync(){
  [['ad1', ADM.speedOn], ['ad2', ADM.immune], ['ad3', ADM.orbs]].forEach(([id, on]) => {
    const b = document.getElementById(id);
    b.setAttribute('aria-pressed', String(on)); b.querySelector('.st').textContent = on ? 'ON' : 'OFF';
  });
  adR.value = adN.value = ADM.speed;
}
function adminToggle(k){
  const key = ['', 'speedOn', 'immune', 'orbs'][k];
  ADM[key] = !ADM[key];
  const on = ADM[key];
  popup(P.x, P.y - 24, ['', 'VELOCIDAD ' + ADM.speed, 'INMUNIDAD', 'ORBES'][k] + (on ? ' ON' : ' OFF'), on ? C.spark : C.dim);
  AudioSys.play(on ? 'select' : 'pop'); adminSync();
}
function adminOpen(o){
  if (o && G.state !== 'play') return;
  ADM.open = o; adEl.hidden = !o;
  if (o) { adminSync(); setPause(true); }
  else { if (adEl.contains(document.activeElement)) document.activeElement.blur(); setPause(false); }
}
function setSpeed(v){ ADM.speed = clamp(Math.round(+v) || 450, 50, 1500); Store.set('esquiva.adspeed', ADM.speed); }
adR.addEventListener('input', () => { setSpeed(adR.value); adN.value = ADM.speed; });
adN.addEventListener('change', () => { setSpeed(adN.value); adminSync(); });
['ad1', 'ad2', 'ad3'].forEach((id, i) => document.getElementById(id).addEventListener('click', e => { adminToggle(i + 1); e.currentTarget.blur(); }));
document.getElementById('adClose').addEventListener('click', () => adminOpen(false));

// ================= Bucle principal =================
function setPause(p){
  if (G.state !== 'play') return;
  G.paused = p; keys.jump = false;
  if (AudioSys.ac) (p ? AudioSys.ac.suspend() : AudioSys.ac.resume()).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play' && !G.paused) setPause(true); });
function handleInput(){
  if (hit.mute) AudioSys.setMuted(!AudioSys.muted);
  if (G.state === 'title') {
    const n = MENUS[G.menu].length;
    if (hit.up) { G.sel = (G.sel + n - 1) % n; AudioSys.play('blip'); }
    if (hit.down) { G.sel = (G.sel + 1) % n; AudioSys.play('blip'); }
    ['ad1', 'ad2', 'ad3'].forEach((k, i) => { if (hit[k] && i < n) { G.sel = i; hit.confirm = true; } });
    if (hit.confirm) MENUS[G.menu][G.sel].act();
    else if (hit.pause && G.menu !== 'main') setMenu('main', G.menu === 'hard' ? 2 : 3);
  } else if (G.state === 'over') {
    if (G.overT > 0.8) { if (hit.confirm) startRun(); else if (hit.menu || hit.pause || hit.quit) toMenu(); }
  } else if (G.state === 'play') {
    if (G.admin && hit.admin) adminOpen(!ADM.open);
    else if (ADM.open) { if (hit.pause) adminOpen(false); }
    else if (hit.pause) setPause(!G.paused);
    else if (G.paused) { if (hit.confirm) setPause(false); else if (hit.quit) toMenu(); }
    else { if (hit.pulse) usePulse(); if (hit.shield) useShield(); }
    if (G.admin && G.state === 'play') { if (hit.ad1) adminToggle(1); if (hit.ad2) adminToggle(2); if (hit.ad3) adminToggle(3); }
  }
}
function step(dt){
  P.extX = P.extY = 0;
  if (G.state === 'play') updateDirector(dt);
  arena.update(dt);
  if (G.state === 'play') { updatePlayer(dt); updateShield(dt); }
  updateBullets(dt);
  if (G.state === 'play') {
    updateShots(dt); collide(dt); updatePickups(dt);
    if (D.phase === 'attack') { G.time += dt; G.score += 10 * comboMult() * scoreMul() * dt; }
  }
  updatePulses(dt); updateFx(dt); Boss.update(dt);
  G.shake = Math.max(0, G.shake - dt * 30); G.flash = Math.max(0, G.flash - dt * 1.5);
  if (G.state === 'dying' && (G.deadT += dt) > 1.3) { G.state = 'over'; G.overT = 0; bJump.style.visibility = 'hidden'; }
}
function idle(dt){
  arena.update(dt); updateFx(dt); Boss.update(dt); G.overT += dt;
  G.shake = Math.max(0, G.shake - dt * 30); G.flash = Math.max(0, G.flash - dt * 1.5);
  if (G.state === 'title') {   // la chispa hace de cursor del menú
    const k = 1 - Math.exp(-dt * 14);
    P.x = lerp(P.x, 172, k); P.y = lerp(P.y, menuY(G.sel), k); P.spin += dt * 2;
  }
}
let lastT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  G.clock += dt;
  handleInput();
  if (G.state === 'title' && AudioSys.ac && !Music.on) { Music.bpm = 112; Music.start(0); }
  Music.danger = G.state === 'play' && P.hp <= P.maxHp * 0.3;
  if (!G.paused) {
    if (G.state === 'play' || G.state === 'dying') { const n = Math.max(1, Math.ceil(dt / 0.0084)), h = dt / n; for (let i = 0; i < n; i++) step(h); }
    else idle(dt);
  }
  document.body.classList.toggle('hidecursor', G.ctrl === 'mouse' && G.state === 'play' && !G.paused);
  if (isTouch) {
    bPulse.classList.toggle('ready', P.charge >= 100 && G.state === 'play');
    bShield.classList.toggle('ready', P.shieldCd <= 0 && P.shieldT <= 0 && G.state === 'play');
    const lbl = P.shieldT > 0 ? 'ACTIVA' : P.shieldCd > 0 ? Math.ceil(P.shieldCd) + ' s' : 'INVENC.';
    if (bShield.textContent !== lbl) bShield.textContent = lbl;
  }
  render();
  for (const k in hit) hit[k] = false;
  Music.tick();
}

// Ganchos para pruebas automáticas (no afectan al juego)
window.__esq = { G, D, P, A, ADM, Music, AudioSys, bullets, shots, PATTERNS, startRun, step, render, toMenu, adminOpen, adminToggle,
  play(id, wave = 6){
    if (G.state !== 'play') startRun();
    clearField();
    const p = PATTERNS.find(q => q.id === id);
    Object.assign(D, { wave, diff: 1 + (wave - 1) * 0.11, picks: [p], combo: false, isNew: false });
    arena.set(p.box[0], p.box[1]); arena.snap(); P.mode = p.mode; P.x = A.x; P.y = A.y;
    beginAttack();
  },
  sim(sec){ for (let i = 0, n = Math.round(sec * 120); i < n; i++) step(1 / 120); } };

function boot(data){
  if (data && data.best && data.best.score > best.score) best = data.best;
  resize(); adminSync();
  arena.set(360, MENUS.main.length * MENU_GAP + 14, 300, MENU_CY); arena.snap(); P.x = 172; P.y = menuY(0);
  Boss.say('¿Juegas? Elige cómo moverte.', 1e9);
  if (document.fonts && document.fonts.load) { document.fonts.load('20px Bungee').catch(() => {}); document.fonts.load('700 14px "Chakra Petch"').catch(() => {}); }
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
try { window.claude?.hot?.snapshot?.(() => ({ best })); } catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
</script>
