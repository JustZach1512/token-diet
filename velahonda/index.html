const GLYPH={};
for(const k in GL){const [w,s]=GL[k];GLYPH[k]={w,p:s.split('|').map(ps=>{const pts=[];let c=null;for(const tok of ps.trim().split(/\s+/)){if(tok[0]==='~'){c=tok.slice(1).split(',').map(Number);}else{const [x,y]=tok.split(',').map(Number);pts.push(c?[x,y,c[0],c[1]]:[x,y]);c=null;}}return pts;})};}
const ACC={'á':['A','a'],'é':['E','a'],'í':['I','a'],'ó':['O','a'],'ú':['U','a'],'ñ':['N','t'],'ü':['U','d'],'Á':['A','a'],'É':['E','a'],'Í':['I','a'],'Ó':['O','a'],'Ú':['U','a'],'Ñ':['N','t'],'Ü':['U','d']};
function gInfo(ch){let acc=null,base=ch,small=false;const a=ACC[ch];if(a){base=a[0];acc=a[1];small=ch!==ch.toUpperCase();}else if(ch>='a'&&ch<='z'){base=ch.toUpperCase();small=true;}return{g:GLYPH[base]||GLYPH['?'],sc:small?0.8:1,acc};}
function textWidth(str,size){const u=size/10;let w=0;for(const ch of str){if(ch===' '){w+=3.6*u;continue;}const gi=gInfo(ch);w+=(gi.g.w*gi.sc+1.9)*u;}return Math.max(0,w-1.9*u);}
function drawGlyphs(g,str,x,y,size){
  const u=size/10;let cx=x;g.beginPath();
  for(const ch of str){
    if(ch===' '){cx+=3.6*u;continue;}
    const gi=gInfo(ch),s=gi.sc*u,oy=y+size-10*s;
    for(const path of gi.g.p){let f=true;for(const p of path){const px=cx+p[0]*s,py=oy+p[1]*s;if(f){g.moveTo(px,py);f=false;}else if(p.length>2)g.quadraticCurveTo(cx+p[2]*s,oy+p[3]*s,px,py);else g.lineTo(px,py);}}
    if(gi.acc){const m=cx+gi.g.w*s/2,tp=oy-1.3*s;
      if(gi.acc==='a'){g.moveTo(m-0.7*s,tp);g.lineTo(m+1.3*s,tp-2.4*s);}
      else if(gi.acc==='t'){g.moveTo(m-2.3*s,tp-0.5*s);g.quadraticCurveTo(m-1.2*s,tp-2.7*s,m,tp-1.4*s);g.quadraticCurveTo(m+1.2*s,tp-0.1*s,m+2.3*s,tp-2.2*s);}
      else{g.moveTo(m-1.4*s,tp-1);g.lineTo(m-1.4*s,tp-1.4*s);g.moveTo(m+1.4*s,tp-1);g.lineTo(m+1.4*s,tp-1.4*s);}}
    cx+=(gi.g.w*gi.sc+1.9)*u;
  }
  g.stroke();
}
const TXC=new Map();
let SC=1;
// txt: dibuja texto con la fuente propia. y = parte superior de las mayúsculas.
function txt(str,x,y,size,col,align,o){
  str=String(str).replace(/…/g,'...');col=col||'#e9e1cc';o=o||{};
  const key=str+'|'+size+'|'+col+'|'+(o.glow||'')+'|'+(o.w||'')+'|'+(o.sh||'')+'|'+SC;
  let e=TXC.get(key);
  if(!e){
    const tw=textWidth(str,size),pad=Math.ceil(size*0.7+(o.glow?size*0.8:2));
    const c=mkC((tw+pad*2)*SC,(size*1.6+pad*2)*SC),g=c.getContext('2d');
    g.scale(SC,SC);g.lineCap='round';g.lineJoin='round';
    const lw=Math.max(1.05,size*(o.w||0.115)),oy=pad+size*0.35;
    if(o.sh){g.strokeStyle=o.sh;g.lineWidth=lw+Math.max(2.2,size*0.16);drawGlyphs(g,str,pad,oy,size);}
    if(o.glow){g.shadowColor=o.glow;g.shadowBlur=size*0.7;g.strokeStyle=col;g.lineWidth=lw;drawGlyphs(g,str,pad,oy,size);g.shadowBlur=0;}
    g.strokeStyle=col;g.lineWidth=lw;drawGlyphs(g,str,pad,oy,size);
    e={c,w:tw,pad,oy};TXC.set(key,e);
    if(TXC.size>700)TXC.delete(TXC.keys().next().value);
  }
  let dx=x-e.pad;if(align==='center')dx-=e.w/2;else if(align==='right')dx-=e.w;
  ctx.drawImage(e.c,dx,y-e.oy,e.c.width/SC,e.c.height/SC);
  return e.w;
}
function wrap(str,size,maxw){const out=[];for(const para of String(str).split('\n')){const words=para.split(' ');let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(textWidth(t,size)>maxw&&cur){out.push(cur);cur=w;}else cur=t;}out.push(cur);}return out;}

function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H),d=window.devicePixelRatio||1;
  const n=Math.max(1,Math.min(2,s*d));
  if(Math.abs(n-SC)>0.01||cv.width!==Math.round(W*n)){SC=n;cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);TXC.clear();}
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
}

const OPT={mv:0.6,sv:0.8,shake:true};
try{const o=JSON.parse(localStorage.getItem('velahonda_opt')||'null');if(o)Object.assign(OPT,o);}catch(e){}
function saveOpt(){try{localStorage.setItem('velahonda_opt',JSON.stringify(OPT));}catch(e){}}
const AU={ctx:null,on:false};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
  const c=AU.ctx=new AC();
  AU.master=c.createGain();AU.master.gain.value=0.9;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.2;
  AU.master.connect(comp);comp.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=OPT.mv*0.8;AU.mus.connect(AU.master);
  AU.sfx=c.createGain();AU.sfx.gain.value=OPT.sv;AU.sfx.connect(AU.master);
  AU.rev=c.createConvolver();AU.rev.buffer=impulse(3.2,2.4);
  AU.revOut=c.createGain();AU.revOut.gain.value=0.8;AU.rev.connect(AU.revOut);AU.revOut.connect(AU.master);
  AU.revSend=c.createGain();AU.revSend.gain.value=1;AU.revSend.connect(AU.rev);
  AU.dly=c.createDelay(1.5);AU.dly.delayTime.value=0.42;const fb=c.createGain();fb.gain.value=0.33;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  AU.dly.connect(lp);lp.connect(fb);fb.connect(AU.dly);lp.connect(AU.mus);
  const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.noise=b;
  AU.on=true;
  setInterval(musTick,40);
  if(MUS.want){const w=MUS.want;MUS.want=null;playSong(w);}
  }catch(err){AU.on=false;}
}
function setVolumes(){if(!AU.on)return;AU.mus.gain.value=OPT.mv*0.8;AU.sfx.gain.value=OPT.sv;}
function impulse(dur,decay){const c=AU.ctx,len=Math.floor(c.sampleRate*dur),b=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b;}
const anow=()=>AU.ctx.currentTime;
function tone(o){
  const c=AU.ctx,t=o.t||c.currentTime,os=c.createOscillator();os.type=o.type||'sine';
  os.frequency.setValueAtTime(o.f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+(o.fd||o.d||0.2));
  if(o.det)os.detune.value=o.det;
  const g=c.createGain(),a=o.a||0.004,d=o.d||0.2,v=o.v||0.2;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);
  if(o.s){g.gain.setValueAtTime(v,t+a+o.s);}
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+(o.s||0)+d);
  let src=os;
  if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);src=f;}
  src.connect(g);g.connect(o.dest||AU.sfx);
  if(o.rev){const s=c.createGain();s.gain.value=o.rev;g.connect(s);s.connect(AU.revSend);}
  if(o.dly){const s=c.createGain();s.gain.value=o.dly;g.connect(s);s.connect(AU.dly);}
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.f*0.008;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+a+(o.s||0)+d+0.1);}
  os.start(t);os.stop(t+a+(o.s||0)+d+0.05);
}
function noise(o){
  const c=AU.ctx,t=o.t||c.currentTime,src=c.createBufferSource();src.buffer=AU.noise;src.loop=true;
  const fl=c.createBiquadFilter();fl.type=o.ft||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);
  if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);fl.Q.value=o.q||1;
  const g=c.createGain(),a=o.a||0.003;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.v||0.2,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+o.d);
  src.connect(fl);fl.connect(g);g.connect(o.dest||AU.sfx);
  if(o.rev){const s=c.createGain();s.gain.value=o.rev;g.connect(s);s.connect(AU.revSend);}
  src.start(t,Math.random()*1.5);src.stop(t+a+o.d+0.05);
}

function prepSong(s){

  if(s.drums){const p=s.drums[0].replace(/ /g,'');s._dr=p;}
  s._p=true;return s;
}

function room(id,zone,gx,gy,w,h,o,build){
  const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill('#'));
  const b={
    R(x,y,ww,hh,c){c=c||'#';for(let j=y;j<y+hh;j++)for(let i=x;i<x+ww;i++)if(j>=0&&j<h&&i>=0&&i<w)g[j][i]=c;},
    O(x,y,ww,hh){b.R(x,y,ww,hh,'.');},
    H(x,y,ww,c){b.R(x,y,ww,1,c||'=');},
    V(x,y,hh,c){b.R(x,y,1,hh,c||'|');},
    S(x,y,c){if(y>=0&&y<h&&x>=0&&x<w)g[y][x]=c;},
  };
  build(b);
  ROOMS[id]=Object.assign({id,zone,gx,gy,w,h,g:g.map(r=>r.join('')),ents:{},tablets:[]},o);
}

/* ---------- Diálogos ---------- */
const NPCN={cirio:'Abuela Cirio',brasa:'Brasa, la Buhonera',liquen:'Liquen'};
function npcLines(id){

    if(f.boss_micelia)return['Hueles a musgo y a cuarzo. Has bajado mucho, pequeña.','Las grutas guardan ecos de luz. Dicen que un mensajero dejó allí su paso más veloz.'];
    if(f.boss_fuelle)return['¿Venciste al Fuelle? Entonces el pozo ya está abierto.','El Bosque Micelio respira bajo la aldea. Sus esporas cantan cuando nadie las oye.','Hay un viejo pozo bajo esta plaza. Su palanca quedó abajo, entre las raíces.'];
    return['El Pozo del Fuelle está al este, pasada la plaza. Golpea con tu aguja, salta, y no te rindas.','Si te hieren, mantén V: la luz de tu farol cerrará tus heridas.'];
  }
  if(id==='liquen'){
    if(!t.liquen)return['¡Oh! ¿Tú también te perdiste? Yo llevo… ¿cuántas estaciones? El musgo ya me crece en los hombros.','Me llamo Liquen. Busco la salida desde que el bosque dejó de brillar del todo.','Al oeste vive la Madre de las esporas. Es enorme, y no le gustan las visitas.','Si la vences, dicen que su musgo se pega a las paredes… y a quien lo lleva puesto.'];
    if(f.boss_micelia)return['¡La Madre ya no canta! El bosque está… tranquilo. Raro, pero tranquilo.','Con ese musgo en las manos podrías trepar la vieja chimenea de su cámara. Las raíces de arriba llevan a las grutas.','Y allá arriba, en la repisa de esta pared, hay algo que brilla. Yo no llego. Tú quizá sí.'];

/* ===================== MUNDO: salas, colisiones, render de tiles ===================== */
const C_EMPTY=0,C_SOLID=1,C_ONE=2,C_SPIKE=3,C_WATER=4,C_BWATER=5,C_VINE=6,C_UP=7,C_CR=8,C_CL=9,C_SLIP=10;
const CHAR2C={'#':1,'Z':10,'$':1,'F':1,'D':1,'E':0,'C':1,'=':2,'^':3,'~':4,'%':5,'|':6,'*':7,'}':8,'{':9};
let R=null;
function roomAt(gx,gy){for(const id in ROOMS){const r=ROOMS[id];if(gx>=r.gx&&gx<r.gx+r.w&&gy>=r.gy&&gy<r.gy+r.h)return r;}return null;}
const isSolidC=c=>c===1||c===10;
const isWaterC=c=>c===4||c===5||c===8||c===9;
function oobCol(tx,ty){
  const gx=R.gx+tx,gy=R.gy+ty,n=roomAt(gx,gy);
  if(!n)return(ty<0&&R.zone==='aldea')?0:1;
  const ch=n.g[gy-n.gy][gx-n.gx];
  if(ch==='D')return S.flags[n.gate||n.id]?0:1;
  if(ch==='F')return S.broken[n.id+':'+(gx-n.gx)+','+(gy-n.gy)]?0:1;
  const v=CHAR2C[ch];if(v===undefined||v===C_ONE||v===C_SPIKE)return 0;return v;
}
function colAt(tx,ty){if(tx<0||ty<0||tx>=R.w||ty>=R.h)return oobCol(tx,ty);return R.col[ty*R.w+tx];}
function solidAt(tx,ty){return isSolidC(colAt(tx,ty));}
function solidPt(x,y){return solidAt(Math.floor(x/T),Math.floor(y/T));}
function colPt(x,y){return colAt(Math.floor(x/T),Math.floor(y/T));}
function setCol(x,y,c){if(x>=0&&y>=0&&x<R.w&&y<R.h)R.col[y*R.w+x]=c;}

function moveBody(b,dx,dy,opt){
  opt=opt||{};const res={hx:0,hy:0,ground:false,ceil:false};b.onPlat=null;
  let n=Math.ceil(Math.abs(dx)/10)||1,s=dx/n;
  for(let i=0;i<n;i++){b.x+=s;if(collX(b,s)){res.hx=sgn(s);break;}}
  n=Math.ceil(Math.abs(dy)/10)||1;s=dy/n;
  for(let i=0;i<n;i++){const pb=b.y+b.h;b.y+=s;if(collY(b,s,pb,opt)){if(s>0)res.ground=true;else res.ceil=true;res.hy=sgn(s);break;}}
  return res;
}
function collX(b,s){
  const y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-0.01)/T);
  if(s>0){const tx=Math.floor((b.x+b.w)/T);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){b.x=tx*T-b.w-0.01;return true;}}
  else if(s<0){const tx=Math.floor(b.x/T);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){b.x=(tx+1)*T+0.01;return true;}}
  return false;
}
function collY(b,s,pb,opt){
  const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-0.01)/T);
  if(s>0){const bot=b.y+b.h,ty=Math.floor(bot/T);
    for(let tx=x0;tx<=x1;tx++){const c=colAt(tx,ty);if(isSolidC(c)||(c===C_ONE&&!opt.drop&&pb<=ty*T+0.5)){b.y=ty*T-b.h;return true;}}
    if(opt.plats)for(const p of R.plats){if(b.x+b.w>p.x+2&&b.x<p.x+p.w-2&&pb<=p.y+1&&bot>=p.y){b.y=p.y-b.h;b.onPlat=p;return true;}}
  }else if(s<0){const ty=Math.floor(b.y/T);for(let tx=x0;tx<=x1;tx++)if(isSolidC(colAt(tx,ty))){b.y=(ty+1)*T+0.01;return true;}}
  return false;
}
function groundBelow(b){const y=Math.floor((b.y+b.h+1)/T),x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-0.01)/T);for(let x=x0;x<=x1;x++){const c=colAt(x,y);if(isSolidC(c)||c===C_ONE)return true;}return false;}

/* ---------- Construcción de una sala ---------- */
function buildRoom(id){
  const D=ROOMS[id];
  const r={id,def:D,zone:D.zone,Z:ZONES[D.zone],w:D.w,h:D.h,gx:D.gx,gy:D.gy,col:new Uint8Array(D.w*D.h),
    enemies:[],items:[],npcs:[],benches:[],tablets:[],levers:[],plats:[],crumbles:[],deps:[],stalacs:[],bouncers:[],lamps:[],fakes:[],gatesD:[],gatesE:[],spikes:[],vines:[],ups:[],water:[],deco:[],altar:null,canvas:null,gatesClosed:false};
  let ti=0;
  for(let y=0;y<D.h;y++)for(let x=0;x<D.w;x++){
    const ch=D.g[y][x];let c=CHAR2C[ch];if(c===undefined)c=0;
    const k=id+':'+x+','+y,px=x*T,py=y*T;
    switch(ch){
      case'F':if(S.broken[k])c=0;else r.fakes.push({x,y,k,hp:3,sh:0});break;
      case'$':if(S.broken[k])c=0;else r.deps.push({x,y,k,hp:4,sh:0});break;
      case'D':r.gatesD.push({x,y,o:S.flags[D.gate||D.id]?1:0});if(S.flags[D.gate||D.id])c=0;break;
      case'E':r.gatesE.push({x,y,o:1});break;
      case'C':r.crumbles.push({x,y,st:0,t:0});break;
      case'B':r.benches.push({x:px+T/2,y:py+T});break;
      case'T':r.tablets.push({x:px+T/2,y:py+T,text:D.tablets[ti++]||''});break;
      case'L':r.levers.push({x:px+T/2,y:py+T,flag:D.lever||D.id,on:!!S.flags[D.lever||D.id],t:0});break;
      case'Y':r.stalacs.push({x:px+T/2,y:py,hy:py,st:0,t:0,vy:0});break;
      case'O':r.bouncers.push({x:px-4,y:py+T-16,w:T+8,h:16,t:0});break;
      case'M':case'N':r.plats.push({x:px,y:py,w:80,h:14,hz:ch==='M',dir:1,dx:0,dy:0,ox:px,oy:py});break;
      case'+':r.lamps.push({x:px+T/2,y:py+T});break;
      case'|':r.vines.push({x,y});break;
      case'*':r.ups.push({x,y});break;
      case'P':break;
      default:
        if(ch>='a'&&ch<='z')r.enemies.push(mkEnemy(ch,px+T/2,py+T,D.zone));
        else if(ch>='0'&&ch<='9'){const e=D.ents[ch];if(e)spawnEnt(r,e,px+T/2,py+T);}
    }
    r.col[y*D.w+x]=c;
  }
  // orientación de pinchos
  const sAt=(x,y)=>{if(x<0||y<0||x>=r.w||y>=r.h)return true;return isSolidC(r.col[y*r.w+x]);};
  for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++)if(r.col[y*r.w+x]===C_SPIKE){let d='u';if(sAt(x,y+1))d='u';else if(sAt(x,y-1))d='d';else if(sAt(x-1,y))d='r';else if(sAt(x+1,y))d='l';r.spikes.push({x,y,d});}
  // tramos de agua
  for(let y=0;y<r.h;y++){let x=0;while(x<r.w){const c=r.col[y*r.w+x];if(isWaterC(c)){const blk=c===C_BWATER;let x2=x;while(x2<r.w&&isWaterC(r.col[y*r.w+x2])&&(r.col[y*r.w+x2]===C_BWATER)===blk)x2++;
    const above=y>0?r.col[(y-1)*r.w+x]:0;r.water.push({x,y,w:x2-x,blk,top:!(y>0&&isWaterC(above))});x=x2;}else x++;}}
  // rangos de plataformas móviles
  for(const p of r.plats){const tx=Math.floor(p.ox/T),ty=Math.floor(p.oy/T);
    if(p.hz){let a=tx,b=tx;while(a>0&&a>tx-8&&!isSolidC(r.col[ty*r.w+a-1]))a--;while(b<r.w-3&&b<tx+8&&!isSolidC(r.col[ty*r.w+b+3]))b++;p.a=a*T;p.b=b*T;}
    else{let a=ty,b=ty;while(a>0&&a>ty-8&&!isSolidC(r.col[(a-1)*r.w+tx])&&!isSolidC(r.col[(a-1)*r.w+tx+2]))a--;while(b<r.h-2&&b<ty+8&&!isSolidC(r.col[(b+1)*r.w+tx])&&!isSolidC(r.col[(b+1)*r.w+tx+2]))b++;p.a=a*T;p.b=b*T;}}
  if(S.shade&&S.shade.room===id){const e=mkEnemy('o',S.shade.x,S.shade.y,D.zone);e.amb=0;r.enemies.push(e);}
  r.hide=(D.hide||[]).map(h=>({x:h[0]*T,y:h[1]*T,w:h[2]*T,h:h[3]*T,a:1,open:false}));
  genDeco(r);
  return r;
}
function spawnEnt(r,e,x,y){
  if(e.t==='relic'||e.t==='frag'||e.t==='notch'){if(!S.got[e.id])r.items.push({t:e.t,id:e.id,x,y:y-24,ph:rand(0,6)});}
  else if(e.t==='ability'){r.items.push({t:'ability',id:e.id,x,y:y-30,ph:0,got:!!S.abil[e.id]});}
  else if(e.t==='npc')r.npcs.push({id:e.id,x,y,ph:rand(0,6)});
  else if(e.t==='altar')r.altar={x,y,lit:false};
}

/* ---------- Render estático de la sala (roca dibujada a mano) ---------- */
const ROOMCACHE=new Map();
const NOISEPAT={};
function noiseCanvas(zone){
  if(NOISEPAT[zone])return NOISEPAT[zone];
  const Z=ZONES[zone],c=mkC(256,256),g=c.getContext('2d'),rng=RNG(hashStr(zone)+7);
  for(let i=0;i<260;i++){const x=rng()*256,y=rng()*256,r=2+rng()*14;g.fillStyle=rgba(rng()<.5?Z.rim:'#000000',.05+rng()*.08);g.beginPath();g.ellipse(x,y,r,r*(.4+rng()*.6),rng()*PI,0,TAU);g.fill();
    if(x<20||y<20){g.beginPath();g.ellipse(x+256,y,r,r*.6,0,0,TAU);g.ellipse(x,y+256,r,r*.6,0,0,TAU);g.fill();}}
  g.strokeStyle=rgba('#000000',.25);g.lineWidth=1;
  for(let i=0;i<40;i++){let x=rng()*256,y=rng()*256;g.beginPath();g.moveTo(x,y);for(let j=0;j<4;j++){x+=rng()*16-8;y+=rng()*12;g.lineTo(x,y);}g.stroke();}
  NOISEPAT[zone]=c;return c;
}
function tint(src,col,a){const c=mkC(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=a===undefined?col:rgba(col,a);g.fillRect(0,0,c.width,c.height);return c;}
function erode(src,r){const c=mkC(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='destination-in';const d=r*.7071;
  for(const [dx,dy] of [[r,0],[-r,0],[0,r],[0,-r],[d,d],[-d,d],[d,-d],[-d,-d]])g.drawImage(src,dx,dy);return c;}
function dilate(src,r){const c=mkC(src.width,src.height),g=c.getContext('2d');const d=r*.7071;for(const [dx,dy] of [[0,0],[r,0],[-r,0],[0,r],[0,-r],[d,d],[-d,d],[d,-d],[-d,-d]])g.drawImage(src,dx,dy);return c;}
function rrPath(g,x,y,w,h,tl,tr,br,bl){g.moveTo(x+tl,y);g.lineTo(x+w-tr,y);if(tr)g.quadraticCurveTo(x+w,y,x+w,y+tr);g.lineTo(x+w,y+h-br);if(br)g.quadraticCurveTo(x+w,y+h,x+w-br,y+h);g.lineTo(x+bl,y+h);if(bl)g.quadraticCurveTo(x,y+h,x,y+h-bl);g.lineTo(x,y+tl);if(tl)g.quadraticCurveTo(x,y,x+tl,y);g.closePath();}
function artSolid(r,x,y){
  const cx=clamp(x,0,r.w-1),cy=clamp(y,0,r.h-1),ch=r.def.g[cy][cx];
  if(ch==='#'||ch==='Z')return true;
  if(ch==='F'||ch==='$')return !S.broken[r.id+':'+cx+','+cy];
  return false;
}
function getRoomCanvas(r){
  const key=r.id+'|'+Object.keys(S.broken).filter(k=>k.startsWith(r.id+':')).length;
  if(ROOMCACHE.has(key)){const c=ROOMCACHE.get(key);ROOMCACHE.delete(key);ROOMCACHE.set(key,c);return c;}
  const c=renderRoomCanvas(r);ROOMCACHE.set(key,c);
  while(ROOMCACHE.size>4)ROOMCACHE.delete(ROOMCACHE.keys().next().value);
  return c;
}
function renderRoomCanvas(r){
  const Z=r.Z,pw=(r.w+2)*T,ph=(r.h+2)*T,rng=RNG(hashStr(r.id));
  const mask=mkC(pw,ph),m=mask.getContext('2d');m.fillStyle='#fff';
  const so=(x,y)=>artSolid(r,x,y);
  for(let y=-1;y<=r.h;y++)for(let x=-1;x<=r.w;x++){
    if(!so(x,y))continue;
    const L=!so(x-1,y),Rr=!so(x+1,y),U=!so(x,y-1),Dn=!so(x,y+1),rr=9+rng()*5;
    m.beginPath();rrPath(m,(x+1)*T,(y+1)*T,T,T,L&&U?rr:0,Rr&&U?rr:0,Rr&&Dn?rr:0,L&&Dn?rr:0);m.fill();
    // irregularidades en los bordes expuestos
    if(U)for(let i=0;i<2;i++){m.beginPath();m.arc((x+1)*T+4+rng()*(T-8),(y+1)*T+3+rng()*2,2+rng()*4,0,TAU);m.fill();}
    if(Dn&&rng()<.6){m.beginPath();m.arc((x+1)*T+6+rng()*(T-12),(y+2)*T-2,3+rng()*4,0,TAU);m.fill();}
    if(L&&rng()<.5){m.beginPath();m.arc((x+1)*T+2,(y+1)*T+6+rng()*(T-12),2+rng()*4,0,TAU);m.fill();}
    if(Rr&&rng()<.5){m.beginPath();m.arc((x+2)*T-2,(y+1)*T+6+rng()*(T-12),2+rng()*4,0,TAU);m.fill();}
  }
  const out=mkC(pw,ph),o=out.getContext('2d');
  // halo de roca trasera (profundidad)
  o.globalAlpha=.55;o.drawImage(tint(dilate(mask,16),Z.rock2),0,0);o.globalAlpha=.35;o.drawImage(tint(dilate(mask,34),Z.rock2),0,0);o.globalAlpha=1;
  o.drawImage(tint(mask,Z.rim),0,0);
  const e1=erode(mask,3);o.drawImage(tint(e1,Z.rock2),0,0);
  // textura
  const tex=mkC(pw,ph),tg=tex.getContext('2d');tg.fillStyle=tg.createPattern(noiseCanvas(r.zone),'repeat');tg.fillRect(0,0,pw,ph);tg.globalCompositeOperation='destination-in';tg.drawImage(e1,0,0);o.drawImage(tex,0,0);
  o.globalAlpha=.85;o.drawImage(tint(erode(mask,11),mix(Z.rock2,Z.rock,.6)),0,0);o.globalAlpha=1;
  o.drawImage(tint(erode(mask,24),Z.rock),0,0);
  // banda superior (musgo/ceniza/cristal)
  const band=mkC(pw,ph),bg=band.getContext('2d');bg.drawImage(mask,0,0);bg.globalCompositeOperation='destination-out';bg.drawImage(mask,0,6);
  o.globalAlpha=.9;o.drawImage(tint(band,Z.top),0,0);
  const band2=mkC(pw,ph),b2=band2.getContext('2d');b2.drawImage(mask,0,0);b2.globalCompositeOperation='destination-out';b2.drawImage(mask,0,2);
  o.globalAlpha=.7;o.drawImage(tint(band2,mix(Z.top,'#ffffff',.35)),0,0);o.globalAlpha=1;
  // detalles: grietas, piedras
  o.save();o.translate(T,T);
  for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++){
    if(so(x,y)&&so(x,y-1)&&so(x,y+1)&&so(x-1,y)&&so(x+1,y)&&rng()<.05){o.strokeStyle=rgba(Z.rim,.12);o.lineWidth=1.2;o.beginPath();let px=x*T+rng()*T,py=y*T+rng()*T;o.moveTo(px,py);for(let i=0;i<3;i++){px+=rng()*14-7;py+=rng()*10-2;o.lineTo(px,py);}o.stroke();}
  }
  // plataformas de un sentido y pinchos
  for(let y=0;y<r.h;y++){let x=0;while(x<r.w){if(r.def.g[y][x]==='='){let x2=x;while(x2<r.w&&r.def.g[y][x2]==='=')x2++;drawPlatform(o,r.zone,x*T,y*T,(x2-x)*T,rng);x=x2;}else x++;}}
  for(const s of r.spikes)drawSpike(o,r.zone,s,rng);
  o.restore();
  return out;
}
function drawPlatform(g,zone,x,y,w,rng){
  const Z=ZONES[zone];g.save();
  if(zone==='aldea'){
    g.fillStyle='#2a221d';g.fillRect(x,y+2,w,11);g.fillStyle='#4a3b30';g.fillRect(x,y+2,w,3);
    g.strokeStyle='#1a1410';g.lineWidth=1;for(let i=x+18;i<x+w;i+=26){g.beginPath();g.moveTo(i,y+3);g.lineTo(i,y+13);g.stroke();}
    g.strokeStyle='#2a221d';g.lineWidth=4;g.beginPath();g.moveTo(x+8,y+12);g.lineTo(x+20,y+26);g.moveTo(x+w-8,y+12);g.lineTo(x+w-20,y+26);g.stroke();
    g.fillStyle='#8a7a66';for(let i=x+6;i<x+w;i+=26){g.fillRect(i,y+6,2,2);}
  }else if(zone==='bosque'){

/* ---------- Decoración viva (plantas que se mecen) ---------- */
function genDeco(r){

  for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++){
    const px=x*T,py=y*T;

      else if(z==='bosque'){if(n<.5)r.deco.push({k:'grass',x:px+rng()*T,y:py+T,s:.8+rng()*.7,c:'#2e7a62',f:rng()<.35});else if(n<.66)r.deco.push({k:'shroom',x:px+rng()*T,y:py+T,s:.6+rng()*.9});else if(n<.78)r.deco.push({k:'fern',x:px+rng()*T,y:py+T,s:.8+rng()*.5});}
      else if(z==='grutas'){if(n<.2)r.deco.push({k:'crystal',x:px+rng()*T,y:py+T,s:.6+rng()*.9,a:rng()*.5-.25});else if(n<.35)r.deco.push({k:'grass',x:px+rng()*T,y:py+T,s:.6+rng()*.4,c:'#5a3f8f'});else if(n<.45)r.deco.push({k:'stone',x:px+rng()*T,y:py+T,s:.5+rng()*.5});}
      else if(z==='ciudad'){if(n<.35)r.deco.push({k:'weed',x:px+rng()*T,y:py+T,s:.8+rng()*.8});else if(n<.45)r.deco.push({k:'shell',x:px+rng()*T,y:py+T,s:.7+rng()*.5});}
      else{if(n<.3)r.deco.push({k:'thorn',x:px+rng()*T,y:py+T,s:.7+rng()*.7});else if(n<.38)r.deco.push({k:'flower',x:px+rng()*T,y:py+T,s:.8+rng()*.5});}
    }
    if(empty(x,y)&&sAt(x,y-1)){
      const n=rng();
      if(z==='aldea'&&n<.25)r.deco.push({k:'root',x:px+rng()*T,y:py,s:.6+rng()*.8});
      else if(z==='bosque'&&n<.45)r.deco.push({k:'moss',x:px+rng()*T,y:py,s:.6+rng()*1.2});
      else if(z==='grutas'&&n<.35)r.deco.push({k:'stal',x:px+rng()*T,y:py,s:.5+rng()*1,gl:rng()<.4});
      else if(z==='ciudad'&&n<.25)r.deco.push({k:rng()<.5?'drip':'chain',x:px+rng()*T,y:py,s:.6+rng()*1});

  }

/* ---------- Partículas ---------- */
const PART=[];
function part(o){if(PART.length>1100)PART.splice(0,60);const p={x:0,y:0,vx:0,vy:0,life:1,t:0,size:3,col:'#ffffff',g:0,drag:0,type:'dot',a:1,rot:0,vr:0};for(const k in o)p[k]=o[k];PART.push(p);return p;}
function burst(x,y,n,o){for(let i=0;i<n;i++){const a=o.ang!==undefined?o.ang+rand(-(o.spread||.5),(o.spread||.5)):rand(0,TAU),s=rand(o.smin||60,o.smax||240);const p=Object.assign({},o,{x:x+rand(-(o.jx||0),o.jx||0),y:y+rand(-(o.jy||0),o.jy||0),vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(o.lmin||.3,o.lmax||.7),size:rand(o.szmin||2,o.szmax||4),rot:rand(0,TAU),vr:rand(-8,8)});delete p.ang;part(p);}}
function updParticles(dt){
  for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.t+=dt;if(p.t>=p.life){PART.splice(i,1);continue;}
    p.vx*=1-p.drag*dt;p.vy*=1-p.drag*dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.type==='spore'||p.type==='mote')p.x+=Math.sin(G.t*1.3+p.y*.02)*12*dt;
    if(p.type==='drop'&&solidPt(p.x,p.y)){PART.splice(i,1);if(chance(.6))burst(p.x,p.y-2,2,{col:p.col,type:'dot',smin:20,smax:60,g:400,lmin:.1,lmax:.25,szmin:.8,szmax:1.4,ang:-PI/2,spread:1});}
  }
}
function drawParticles(add){
  for(const p of PART){
    const k=p.t/p.life,isAdd=p.type==='glow'||p.type==='spark'||p.type==='spore'||p.type==='ember'||p.type==='glit'||p.type==='mote';
    if(isAdd!==add)continue;
    if(p.x<CAM.x-50||p.x>CAM.x+VW+50||p.y<CAM.y-50||p.y>CAM.y+VH+50)continue;
    const al=p.a*(p.fadeIn?Math.min(1,p.t*4)*(1-k):(1-k));
    ctx.globalAlpha=Math.max(0,al);
    switch(p.type){
      case'spark':ctx.strokeStyle=p.col;ctx.lineWidth=p.size*.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();break;
      case'ring':ctx.strokeStyle=p.col;ctx.lineWidth=p.lw||2*(1-k)+.5;ctx.beginPath();ctx.arc(p.x,p.y,p.size+(p.grow||120)*k,0,TAU);ctx.stroke();break;
      case'smoke':ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+k*1.5),0,TAU);ctx.fill();break;
      case'leaf':case'shard':ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();if(p.type==='shard'){ctx.moveTo(0,-p.size);ctx.lineTo(p.size*.5,0);ctx.lineTo(0,p.size);ctx.lineTo(-p.size*.5,0);}else ctx.ellipse(0,0,p.size,p.size*.4,0,0,TAU);ctx.fill();ctx.restore();break;
      case'bubble':ctx.strokeStyle=p.col;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x+Math.sin(p.t*5+p.size)*2,p.y,p.size,0,TAU);ctx.stroke();break;
      case'glit':{ctx.fillStyle=p.col;const s=p.size*(.5+.5*Math.sin(p.t*8+p.x));ctx.fillRect(p.x-s/2,p.y-.5,s,1);ctx.fillRect(p.x-.5,p.y-s/2,1,s);break;}
      default:ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.shrink?1-k:1),0,TAU);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
function ambient(dt){

const LIGHTS=[];

const LC=mkC(480,270),LG=LC.getContext('2d');

    const g=LG.createRadialGradient(sx,sy,0,sx,sy,r);g.addColorStop(0,'rgba(0,0,0,'+L.i+')');g.addColorStop(.45,'rgba(0,0,0,'+(L.i*.6)+')');g.addColorStop(1,'rgba(0,0,0,0)');LG.fillStyle=g;LG.fillRect(sx-r,sy-r,r*2,r*2);}

/* ---------- Proyectiles, peligros y ámbar ---------- */
const PROJ=[],HAZ=[],PICK=[];
function updProj(dt){
  for(const p of PROJ){
    if(p.dead)continue;p.t+=dt;
    if(p.home&&p.t<p.home){const a=Math.atan2(P.y+P.h/2-p.y,P.x+P.w/2-p.x),cur=Math.atan2(p.vy,p.vx),sp=Math.hypot(p.vx,p.vy);let da=((a-cur+PI*3)%TAU)-PI;const na=cur+clamp(da,-1.2*dt,1.2*dt);p.vx=Math.cos(na)*sp;p.vy=Math.sin(na)*sp;}
    p.vy+=p.g*dt;if(p.drag){p.vx*=1-p.drag*dt;p.vy*=1-p.drag*dt*.4;}
    if(p.kind==='spore')p.vy=Math.min(p.vy,90);
    p.x+=p.vx*dt+(p.kind==='spore'?Math.sin(p.t*3+p.r)*20*dt:0);p.y+=p.vy*dt;
    if(p.t>p.life){p.dead=true;continue;}
    if(!p.ghost&&solidPt(p.x,p.y)){p.dead=true;burst(p.x,p.y,6,{col:projCol(p),type:'glow',smin:30,smax:140,lmin:.2,lmax:.4,szmin:1,szmax:2.5});if(p.kind==='fire')sfx('fire');continue;}
    if(p.hostile){if(P.state==='normal'&&overlap({x:p.x-p.r*.7,y:p.y-p.r*.7,w:p.r*1.4,h:p.r*1.4},P)){hurtPlayer(p.dmg,p.x,false);p.dead=true;}}
    else{
      for(const e of R.enemies)if(e.alive&&!p.hit.has(e)&&overlap({x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2},e)){p.hit.add(e);hitEnemy(e,p.dmg,sgn(p.vx),'side');}
      if(G.boss&&G.boss.alive&&!G.boss.dying)for(const hb of bossHitBoxes(G.boss))if(!p.hit.has(hb.id)&&overlap({x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2},hb)){p.hit.add(hb.id);damageBoss(G.boss,p.dmg*hb.m,hb);hitFX(p.x,p.y,sgn(p.vx),'#ffb45a');}
      if(chance(.9))part({x:p.x,y:p.y,vx:rand(-30,30)-p.vx*.1,vy:rand(-40,10),life:rand(.2,.45),size:rand(2,p.r*.5),col:chance(.5)?'#ffb45a':'#fff0b0',type:'glow'});
    }
  }
  for(let i=PROJ.length-1;i>=0;i--)if(PROJ[i].dead)PROJ.splice(i,1);
}

function updHaz(dt){

      if(h.kind==='fall'){h.vy=(h.vy||0)+2200*dt;h.y+=h.vy*dt;if(solidPt(h.x+h.w/2,h.y+h.h)){h.dead=true;sfx('shard');burst(h.x+h.w/2,h.y+h.h,10,{col:h.col||'#ff9ae0',type:'shard',smin:80,smax:240,g:800,lmin:.3,lmax:.6,szmin:2,szmax:5});if(h.ring){HAZ.push({kind:'wave',x:h.x+h.w/2-10,y:h.y+h.h-18,w:20,h:18,vx:220,t:0,warn:0,life:.5,col:'#8fe0ff'},{kind:'wave',x:h.x+h.w/2-10,y:h.y+h.h-18,w:20,h:18,vx:-220,t:0,warn:0,life:.5,col:'#8fe0ff'});sfx('smallbell');}}}

function hazRect(h){if(h.kind==='root'||h.kind==='spike'||h.kind==='geyser'){const k=clamp((h.t-h.warn)/.12,0,1);return{x:h.x+4,y:h.y+h.h*(1-k),w:h.w-8,h:h.h*k};}if(h.kind==='beam')return{x:h.x+6,y:h.y,w:h.w-12,h:h.h};return h;}

function dropAmber(x,y,n){while(n>0){const v=n>=10?5:1;n-=v;PICK.push({x:x-4,y:y-4,w:8,h:8,vx:rand(-150,150),vy:rand(-420,-180),v,t:0});}}

    else{k.vy=Math.min(k.vy+1500*dt,700);const r=moveBody(k,k.vx*dt,k.vy*dt,{});if(r.ground){k.vy=-k.vy*.35;if(Math.abs(k.vy)<60)k.vy=0;k.vx*=.7;}if(r.hx)k.vx*=-.5;}

function updWorld(dt){
  for(const p of R.plats){const ox=p.x,oy=p.y,sp=68;
    if(p.hz){p.x+=p.dir*sp*dt;if(p.x<=p.a){p.x=p.a;p.dir=1;}if(p.x>=p.b){p.x=p.b;p.dir=-1;}}else{p.y+=p.dir*sp*dt;if(p.y<=p.a){p.y=p.a;p.dir=1;}if(p.y>=p.b){p.y=p.b;p.dir=-1;}}
    p.dx=p.x-ox;p.dy=p.y-oy;}
  for(const c of R.crumbles){
    if(c.st===0){if(P.onGround&&Math.abs(P.y+P.h-c.y*T)<2&&P.x+P.w>c.x*T&&P.x<c.x*T+T)triggerCrumble(c);}

    else if(s.st===2){s.vy+=1900*dt;s.y+=s.vy*dt;const hb={x:s.x-7,y:s.y+4,w:14,h:28};if(P.state==='normal'&&overlap(hb,P))hurtPlayer(1,s.x,false);

function hitstop(t){G.hitstop=Math.max(G.hitstop,t);}
function toast(text){G.toasts.push({text,t:0});if(G.toasts.length>3)G.toasts.shift();}
function fadeTo(fn,dur){if(G.fade.fn){const f0=G.fade.fn;G.fade.fn=()=>{f0();fn();};return;}G.fade.fn=fn;G.fade.dir=1;G.fade.dur=dur||.5;}
function enterRoom(id,px,py){
  const prevZone=R?R.zone:null;
  R=buildRoom(id);R.canvas=getRoomCanvas(R);
  PROJ.length=0;HAZ.length=0;PICK.length=0;PART.length=0;AFTER.length=0;G.boss=null;G.bossCard=null;G.darkExtra=0;
  P.x=px;P.y=py;S.visited[id]=true;
  if(R.zone!==prevZone)G.zcard={name:R.Z.name,sub:R.Z.sub,t:0};
  if(!(id==='E3'&&S.flags.boss_apagador))playSong(R.Z.music);else playSong(null);
  camUpdate(0,true);
}
function checkTransition(){
  if(P.state!=='normal')return;
  const cx=P.x+P.w/2,cy=P.y+P.h/2;let dir=null;
  if(cx<0)dir='L';else if(cx>=R.w*T)dir='R';else if(cy<0)dir='U';else if(cy>=R.h*T)dir='D';
  if(!dir)return;
  const gx=R.gx*T+cx,gy=R.gy*T+cy,n=roomAt(Math.floor(gx/T),Math.floor(gy/T));
  if(!n){if(dir==='D'){P.y=R.h*T-P.h-1;hurtPlayer(1,cx,true);}else{P.x=clamp(P.x,0,R.w*T-P.w);if(P.y<-60)P.y=-60;}return;}
  const vx=P.vx,vy=P.vy,cl=P.climb;
  enterRoom(n.id,gx-n.gx*T-P.w/2,gy-n.gy*T-P.h/2);
  if(dir==='L')P.x-=4;if(dir==='R')P.x+=4;if(dir==='D')P.y+=4;
  if(dir==='U'){P.y-=4;const vine=colPt(P.x+P.w/2,P.y+P.h/2)===C_VINE||colPt(P.x+P.w/2,P.y+4)===C_VINE;if(cl&&vine){P.climb=true;P.vy=vy;}else{P.climb=false;P.vy=Math.min(vy,-660);}}else P.vy=vy;
  P.vx=vx;for(const q of P.cape){q.x=q.px=P.x+P.w/2;q.y=q.py=P.y+10;}
  G.fade.a=Math.max(G.fade.a,.55);G.fade.dur=.3;camUpdate(0,true);
}
function collectItem(it){
  it.got=true;const x=it.x,y=it.y;
  burst(x,y,30,{col:'#ffe0a0',type:'glow',smin:60,smax:300,lmin:.4,lmax:1,szmin:2,szmax:4});part({x,y,type:'ring',col:'#ffffff',size:6,grow:120,life:.5,lw:3});G.flash={c:'#ffffff',a:.3};
  if(it.t==='ability'){S.abil[it.id]=true;sfx('ability');showSplash('ability',it.id);shake(.3);saveGame();return;}
  S.got[it.id]=true;R.items=R.items.filter(q=>q!==it);
  if(it.t==='relic'){S.relics.push(it.id);sfx('item');showSplash('relic',it.id);}
  else if(it.t==='frag'){S.frags++;sfx('item');if(S.frags%2===0){P.hp=hpMax();toast('Una nueva llama arde en tu interior');}else toast('Fragmento de cirio (1/2)');}
  else if(it.t==='notch'){S.notches++;sfx('item');toast('Engarce de reliquia: ahora tienes '+S.notches);}
}
function sitBench(b){
  P.state='sit';P.sitT=0;P.x=b.x-P.w/2;P.vx=P.vy=0;P.healing=false;P.slash=null;calcStats();P.hp=hpMax();
  S.bench={room:R.id,x:b.x,y:b.y};sfx('bench');saveGame();toast('Has descansado. Tu camino queda guardado.');
  burst(b.x,b.y-20,20,{col:'#ffd27a',type:'glow',smin:20,smax:90,ang:-PI/2,spread:1.2,lmin:.6,lmax:1.4,szmin:1.5,szmax:3});
}
function respawnBench(){
  const b=S.bench;calcStats();resetPlayer(b.x-9,b.y-30);enterRoom(b.room,b.x-9,b.y-30);
  P.hp=hpMax();P.energy=0;if(!b.nb&&R.benches.some(q=>Math.abs(q.x-b.x)<4)){P.state='sit';P.sitT=0;}
  G.slow=1;G.slowT=0;G.fade.dur=1;camUpdate(0,true);
}
function newGame(){
  S=newSave();calcStats();let sx=5,sy=15;const D=ROOMS.A1;for(let y=0;y<D.h;y++){const x=D.g[y].indexOf('P');if(x>=0){sx=x;sy=y;}}
  const px=sx*T+T/2-9,py=(sy+1)*T-30;resetPlayer(px,py);P.hp=hpMax();P.energy=0;R=null;
  S.bench={room:'A1',x:sx*T+T/2,y:(sy+1)*T,nb:true};enterRoom('A1',px,py);G.mode='play';G.sub=null;G.fade.dur=1.4;
  setTimeout(()=>{if(G.mode==='play'&&R&&R.id==='A1')toast('Acércate a la inscripción y pulsa ↑ para leerla');},5200);
}
function continueGame(){
  const d=loadSave();if(!d){newGame();return;}S=Object.assign(newSave(),d);calcStats();R=null;respawnBench();G.mode='play';G.sub=null;
}
function toTitle(){G.mode='title';G.titleT=0;G.sub=null;G.boss=null;G.hasSave=hasSave();G.menu={i:G.hasSave?1:0,c:0};playSong('title');R=null;G.zcard=null;G.toasts=[];}
function update(dt){
  G.t+=dt;
  if(G.fade.dir===1){G.fade.a+=dt/G.fade.dur;if(G.fade.a>=1){G.fade.a=1;const f=G.fade.fn;G.fade.fn=null;G.fade.dir=-1;if(f)f();}}else G.fade.a=Math.max(0,G.fade.a-dt/(G.fade.dur||.5));
  if(G.flash){G.flash.a-=dt*2.5;if(G.flash.a<=0)G.flash=null;}
  for(const q of G.toasts)q.t+=dt;G.toasts=G.toasts.filter(q=>q.t<3.6);
  if(G.zcard){G.zcard.t+=dt;if(G.zcard.t>4.6)G.zcard=null;}
  if(G.bossCard&&G.mode==='play'){G.bossCard.t+=dt;if(G.bossCard.t>4)G.bossCard=null;}
  switch(G.mode){
    case'title':G.titleT+=dt;if(!G.fade.fn)updTitle(dt);break;
    case'play':updPlay(dt);break;
    case'pause':updPause();break;
    case'map':if(pressed('map')||pressed('back')||pressed('pause')){G.mode=G.mapFrom==='pause'?'pause':'play';G.mapFrom=null;sfx('back');}break;
    case'relics':updRelics(dt);break;
    case'shop':updShop();break;
    case'dialog':updDialog(dt);break;
    case'splash':updSplash(dt);break;
    case'ending':updEnding(dt);break;
  }
}
function updPlay(dt){
  if(!G.fade.fn&&P.state!=='dead'&&P.state!=='haz'&&P.state!=='cut'){
    if(pressed('pause')){G.mode='pause';G.menu.i=0;G.sub=null;sfx('menu');return;}
    if(pressed('map')){G.mode='map';G.mapFrom='play';sfx('menu');return;}}
  S.time+=dt;
  if(G.hitstop>0){G.hitstop-=dt;updParticles(dt*.15);return;}
  if(G.slowT>0){G.slowT-=dt;if(G.slowT<=0)G.slow=1;}
  const sdt=dt*G.slow;
  updWorld(sdt);updPlayer(sdt);if(G.mode!=='play')return;
  checkTransition();bossTrigger();updEnemies(sdt);updBoss(sdt);updProj(sdt);updHaz(sdt);updPick(sdt);updParticles(sdt);ambient(sdt);camUpdate(sdt);
}
const VIGN=(()=>{const c=mkC(W,H),g=c.getContext('2d'),gr=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.62)');g.fillStyle=gr;g.fillRect(0,0,W,H);return c;})();
const GRAIN=(()=>{const c=mkC(256,256),g=c.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);return c;})();
function drawWorld(){
  LIGHTS.length=0;drawBackground();
  ctx.save();ctx.scale(ZOOM,ZOOM);const vx=CAM.x+CAM.sx,vy=CAM.y+CAM.sy;ctx.translate(-Math.round(vx*ZOOM)/ZOOM,-Math.round(vy*ZOOM)/ZOOM);
  if(G.boss&&BOSS[G.boss.id].drawBack)BOSS[G.boss.id].drawBack(G.boss);
  const c=R.canvas,sx=clamp(Math.floor(vx+T-2),0,c.width-1),sy=clamp(Math.floor(vy+T-2),0,c.height-1),sw=Math.min(c.width-sx,Math.ceil(VW+8)),sh=Math.min(c.height-sy,Math.ceil(VH+8));
  ctx.drawImage(c,sx,sy,sw,sh,sx-T,sy-T,sw,sh);
  drawDeco(false);drawWorldEnts();
  for(const e of R.enemies)drawEnemy(e);
  if(G.boss)BOSS[G.boss.id].draw(G.boss);
  drawPick();drawPlayer();drawProj();drawHaz();drawWater();drawDeco(true);drawHidden(1/60);
  drawParticles(false);ctx.globalCompositeOperation='lighter';drawParticles(true);ctx.globalCompositeOperation='source-over';
  ctx.restore();
  drawForeground();
  renderLighting(Math.min(.95,R.Z.darkA+G.darkExtra));
  ctx.globalCompositeOperation='soft-light';ctx.fillStyle=rgba(R.Z.grade,.2);ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  ctx.drawImage(VIGN,0,0,W,H);
  ctx.globalAlpha=.045;const gx=-Math.floor(Math.random()*256),gy=-Math.floor(Math.random()*256);for(let x=gx;x<W;x+=256)for(let y=gy;y<H;y+=256)ctx.drawImage(GRAIN,x,y);ctx.globalAlpha=1;
  drawPrompt();
}
function render(){
  ctx.setTransform(SC,0,0,SC,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.imageSmoothingEnabled=true;
  if(G.mode==='title')drawTitle();
  else if(G.mode==='ending')drawEnding();
  else if(R){
    drawWorld();drawHUD();drawBossUI();drawZoneCard();drawToasts();
    if(G.mode==='play'&&P.state==='sit'&&P.sitT>.4)txt('↑ Reliquias   ·   ← → Levantarse',W/2,H-42,12,'#e8dcc0','center',{sh:'#000000'});
    if(G.mode==='pause')drawPause();else if(G.mode==='map')drawMap();else if(G.mode==='relics')drawRelics();else if(G.mode==='shop')drawShop();else if(G.mode==='dialog')drawDialog();else if(G.mode==='splash')drawSplash();
  }
  if(G.flash){ctx.fillStyle=rgba(G.flash.c,Math.min(1,G.flash.a));ctx.fillRect(0,0,W,H);}
  if(G.fade.a>0){ctx.fillStyle=rgba('#000000',G.fade.a);ctx.fillRect(0,0,W,H);}
  drawTouch();
}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;pollPad();pollInput();update(dt);render();}
// Ganchos de depuración (útiles para pruebas automáticas)
window.__vh={G,get S(){return S;},P,get R(){return R;},enterRoom,newGame,
  warp(id,tx,ty){enterRoom(id,tx*T+T/2-9,ty*T+T-30);P.vx=P.vy=0;P.state='normal';},
  all(){for(const k in ABIL)S.abil[k]=true;calcStats();}};
resize();calcStats();G.hasSave=hasSave();G.menu.i=G.hasSave?1:0;playSong('title');requestAnimationFrame(frame);
</script>
